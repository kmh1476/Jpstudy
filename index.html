<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본어 학습 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK — no build step needed, works straight from GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- 딱 한 번만 채워두는 설정 파일 — 이 index.html을 새로 받아도 절대 건드릴 필요 없음 -->
<script src="firebase-config.js"></script>

<style>
  :root {
    --paper: #EAEAE2; --paper2: #DEDFD3; --paper-card: #F5F5EF;
    --line: #C9CABB; --line-strong: #AAAB98;
    --ink: #24261E; --muted: #74766A;
    --hanko: #BE2B22; --jade: #43705C; --indigo: #35526F; --purple-acc: #71548C;
    --jade-dim: #D7E2DA; --hanko-dim: #EED6D2;
    --grid-line: rgba(36,34,24,0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; color: var(--ink); font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 27px 27px;
  }

  :root[data-theme="dark"] {
    --paper:#1C1A16; --paper2:#252220; --paper-card:#231F1A;
    --line:#453F35; --line-strong:#5A5344; --ink:#E7E0D0; --muted:#A29786;
    --jade-dim:#243530; --hanko-dim:#3A2620;
    --grid-line: rgba(255,255,255,0.045);
  }
  :root[data-theme="blue"] {
    --paper:#E6EEF4; --paper2:#D8E5EE; --paper-card:#F5F9FC;
    --line:#C3D7E4; --line-strong:#9FBDD1; --ink:#1A2735; --muted:#586F82;
    --jade-dim:#D7E2DA; --hanko-dim:#EED6D2;
  }
  :root[data-theme="green"] {
    --paper:#E7EFE4; --paper2:#D9E7D5; --paper-card:#F5FAF3;
    --line:#C0D9BB; --line-strong:#9BC494; --ink:#1B301F; --muted:#59745C;
    --jade-dim:#CFE3D0; --hanko-dim:#EED6D2;
  }
  :root[data-theme="red"] {
    --paper:#F3E7E3; --paper2:#EAD7D1; --paper-card:#FAF2EF;
    --line:#E0BFB6; --line-strong:#CE988B; --ink:#361713; --muted:#845852;
    --jade-dim:#D7E2DA; --hanko-dim:#EFCFC7;
  }
  :root[data-theme="yellow"] {
    --paper:#F2ECD6; --paper2:#EADEB2; --paper-card:#FAF6E6;
    --line:#DECD8C; --line-strong:#C9B15D; --ink:#372C0C; --muted:#83723F;
    --jade-dim:#DFE3C1; --hanko-dim:#EED6D2;
  }
  :root[data-theme="purple"] {
    --paper:#EEE7F1; --paper2:#E1D5E7; --paper-card:#F8F3FA;
    --line:#D2BEDC; --line-strong:#B698C8; --ink:#291C36; --muted:#6C5880;
    --jade-dim:#D8DED6; --hanko-dim:#E8D2E8;
  }

  h1, h2, h3, .serif { font-family: 'Noto Serif JP', 'Noto Sans KR', serif; }
  #app { max-width: 900px; margin: 0 auto; padding: 24px 18px 60px; display: none; }
  #login-screen { max-width: 380px; margin: 60px auto; padding: 0 18px; }

  header.top { margin-bottom: 20px; position: relative; padding-top: 4px; }
  header.top .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-right: 50px; }
  header.top h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  header.top .stamp {
    display: inline-block; border: 2px solid var(--hanko); color: var(--hanko);
    font-size: 12px; padding: 2px 8px; border-radius: 2px; transform: rotate(-4deg);
    font-family: 'Noto Serif JP', serif; font-weight: 700;
  }
  header.top p.sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; padding-right: 50px; }
  .sync-badge { color: var(--muted); font-size: 12px; display: block; margin-top: 4px; cursor: help; }
  .logout-row { margin-top: 6px; }
  .logout-row button { font-size: 12px; }

  .theme-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .theme-dot {
    width: 15px; height: 15px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
  }
  .theme-dot.active { border-color: var(--ink); transform: scale(1.25); }

  nav.tabs { display: flex; gap: 4px; margin-top: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--line-strong); padding-bottom: 0; }
  nav.tabs button {
    font-family: 'Noto Serif JP', serif; font-size: 14px; font-weight: 500; padding: 10px 16px 9px;
    background: var(--paper2); color: var(--muted); border: 1px solid var(--line-strong); border-bottom: none;
    border-radius: 4px 4px 0 0; cursor: pointer; position: relative; top: 2px; display: flex; align-items: center; gap: 6px;
    transition: transform 0.15s ease;
  }
  nav.tabs button.active {
    background: var(--paper-card); color: var(--ink); font-weight: 700; top: 0;
    border-color: var(--line-strong); border-bottom: 2px solid var(--paper-card);
  }
  nav.tabs button .badge { background: var(--hanko); color: #fff; border-radius: 2px; font-size: 11px; padding: 1px 6px; font-family: 'Noto Sans KR', sans-serif; }
  nav.tabs button:not(.active):hover { transform: translateY(-2px); }

  section.panel { background: var(--paper-card); border: 1px solid var(--line-strong); border-top: none; border-radius: 0 4px 4px 4px; padding: 22px; min-height: 300px; }
  .hidden { display: none !important; }
  section.panel.hidden { display: none; }

  .review-summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .review-card { flex: 1 1 130px; border: 1px solid var(--line-strong); padding: 12px 14px; background: var(--paper); }
  .review-card .n { font-size: 24px; font-weight: 700; font-family: 'Noto Serif JP', serif; }
  .review-card .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .review-start-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .cat-review-block { margin-top: 14px; }
  .cat-review-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .cat-review-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-review-chip {
    font-size: 13px; padding: 6px 14px; border-radius: 3px; border: 1.5px solid currentColor;
    background: var(--paper); cursor: pointer; font-family: 'Noto Serif JP', serif; font-weight: 500;
  }
  .cat-review-chip span { font-family: 'Noto Sans KR', sans-serif; opacity: 0.75; margin-left: 4px; }
  .cat-review-chip:hover { filter: brightness(0.97); }

  .cat-vocab { color: var(--hanko); } .cat-kanji { color: var(--jade); }
  .cat-grammar { color: var(--indigo); } .cat-expr { color: var(--purple-acc); }

  button.primary { background: var(--ink); color: var(--paper-card); border: none; padding: 11px 20px; border-radius: 3px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); padding: 9px 16px; border-radius: 3px; cursor: pointer; font-size: 13px; }
  button.ghost { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: underline; }
  button.icon-x { background: var(--paper); border: 1px solid var(--line-strong); color: var(--hanko); border-radius: 2px; width: 30px; height: 34px; cursor: pointer; font-size: 15px; flex-shrink: 0; }

  .flashcard {
    border: 2px solid var(--line-strong); border-radius: 3px; padding: 34px 24px;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 21px 21px;
    text-align: center; margin: 10px 0 18px; min-height: 170px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    touch-action: pan-y; cursor: pointer; user-select: none;
  }
  .flashcard .cat-tag { font-size: 12px; color: var(--muted); }
  .flashcard .front { font-size: 42px; font-weight: 700; font-family: 'Noto Serif JP', serif; line-height: 1.4; letter-spacing: 0.04em; white-space: pre-wrap; }
  .flashcard .back { text-align: left; width: 100%; margin-top: 12px; border-top: 1px dashed var(--line-strong); padding-top: 14px; cursor: default; }
  .flashcard .back .row { margin-bottom: 22px; font-size: 15px; line-height: 1.7; }
  .flashcard .back .row:last-child { margin-bottom: 0; }
  .flashcard .back .row b {
    display: inline-block; color: var(--ink); font-weight: 700; font-size: 11px;
    opacity: 0.85; border-left: 3px solid var(--line-strong); padding: 2px 8px; margin-bottom: 5px;
  }
  .flashcard .back .row b.label-on { color: var(--jade); border-left-color: var(--jade); }
  .flashcard .back .row b.label-kun { color: var(--indigo); border-left-color: var(--indigo); }
  .flashcard .back .row .row-inline { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 15px; margin-left: 8px; }
  .flashcard .back .row .row-value { display: block; white-space: pre-wrap; padding-left: 16px; margin-top: 6px; line-height: 2; }
  .flashcard .back .row .row-value-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-top: 6px; padding-left: 16px; }
  .flashcard .back .row .row-value-grid .word-item { white-space: pre-wrap; line-height: 1.6; }
  .swipe-hint { font-size: 11px; color: var(--muted); margin-top: 10px; }
  .review-actions { display: flex; gap: 10px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .review-actions button.forgot { background: var(--hanko); color: #fff; border: none; }
  .review-actions button.remembered { background: var(--jade); color: #fff; border: none; }
  .review-actions button { padding: 10px 22px; border-radius: 3px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .review-done { text-align: center; padding: 40px 10px; color: var(--muted); }
  .review-done .review-actions { margin-top: 16px; }

  form.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px dashed var(--line-strong); }
  form.entry .full { grid-column: 1 / -1; }
  .dup-warning { color: var(--hanko); font-size: 13px; min-height: 0; }
  .dup-warning:empty { display: none; }
  form.entry label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  form.entry input, form.entry textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--paper); color: var(--ink); font-size: 15px; font-family: inherit; }
  form.entry textarea { resize: vertical; min-height: 44px; }
  form.entry .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  .genko-wrap { display: flex; align-items: center; gap: 10px; }
  .genko-cell { width: 64px; height: 64px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; position: relative; background: var(--paper); }
  .genko-cell::before, .genko-cell::after { content: ''; position: absolute; background: var(--line-strong); opacity: 0.6; }
  .genko-cell::before { width: 100%; height: 1px; top: 50%; left: 0; }
  .genko-cell::after { height: 100%; width: 1px; left: 50%; top: 0; }
  .genko-cell input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; font-family: 'Noto Serif JP', serif; font-size: 34px; color: var(--ink); position: relative; z-index: 1; }
  .genko-cell input:focus { outline: 2px solid var(--jade); outline-offset: 2px; }

  .list-controls { margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
  .search-input { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--paper); color: var(--ink); font-size: 14px; }
  .sort-row { display: flex; gap: 6px; }
  .sort-row button { font-size: 12px; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--muted); cursor: pointer; }
  .sort-row button.active { background: var(--ink); color: var(--paper-card); border-color: var(--ink); }
  .kana-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .kana-chip { font-size: 12px; padding: 5px 10px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--muted); cursor: pointer; font-family: 'Noto Serif JP', serif; }
  .kana-chip.active { background: var(--jade); color: #fff; border-color: var(--jade); }

  .pagination-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
  .pagination-row button { font-size: 13px; padding: 7px 14px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); cursor: pointer; }
  .pagination-row button:disabled { opacity: 0.35; cursor: not-allowed; }
  .pagination-row .page-indicator { font-size: 12px; color: var(--muted); }

  .stats-panel { border: 1px solid var(--line-strong); padding: 12px 16px; margin-bottom: 16px; background: var(--paper); }
  .streak-inline { font-size: 13px; font-weight: 700; color: var(--hanko); }
  .level-chart { display: flex; align-items: flex-end; gap: 6px; height: 48px; margin-top: 10px; }
  .level-bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; height: 100%; }
  .level-bar { width: 100%; max-width: 22px; background: var(--jade); }
  .level-bar-label { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .level-chart-caption { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; }

  .direction-row { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .direction-label { font-size: 12px; color: var(--muted); }
  .direction-row button { font-size: 12px; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--paper); color: var(--muted); cursor: pointer; }
  .direction-row button.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }

  .front-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .speak-btn { background: none; border: 1px solid var(--line-strong); border-radius: 50%; width: 38px; height: 38px; font-size: 16px; cursor: pointer; color: var(--ink); flex-shrink: 0; }
  .speak-btn:hover { background: var(--paper2); }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { border: 1px solid var(--line-strong); border-radius: 2px; padding: 12px 14px; background: var(--paper); display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; flex-wrap: wrap; }
  .item-row .main { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .item-row .word { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 21px; letter-spacing: 0.02em; white-space: pre-wrap; }
  .item-row .reading { color: var(--muted); font-size: 14px; white-space: pre-wrap; }
  .item-row .meaning { color: var(--ink); font-size: 14px; white-space: pre-wrap; }
  .item-row .meta { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  .box-chip { color: var(--jade); font-weight: 700; font-size: 11px; border-bottom: 1px solid var(--jade); padding-bottom: 1px; }
  .due-chip { display: inline-block; background: var(--hanko); color: #fff; padding: 2px 7px; border-radius: 2px; font-size: 11px; font-weight: 700; transform: rotate(-2deg); }
  .created-chip { color: var(--muted); font-size: 11px; }
  .item-detail { border: 1px solid var(--line-strong); border-radius: 2px; padding: 14px 16px; background: var(--paper2); margin-top: -4px; margin-bottom: 8px; }
  .item-detail .row { font-size: 14px; margin-bottom: 22px; line-height: 1.7; }
  .item-detail .row:last-child { margin-bottom: 0; }
  .item-detail .row b {
    display: inline-block; color: var(--ink); font-weight: 700; font-size: 12px;
    background: var(--paper); border-left: 3px solid var(--line-strong);
    padding: 3px 8px; margin-bottom: 5px; border-radius: 0 2px 2px 0;
  }
  .item-detail .row b.label-on { color: var(--jade); border-left-color: var(--jade); }
  .item-detail .row b.label-kun { color: var(--indigo); border-left-color: var(--indigo); }
  .item-detail .row .row-inline { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 14px; margin-left: 8px; }
  .item-detail .row .row-value { display: block; white-space: pre-wrap; padding-left: 16px; margin-top: 6px; line-height: 2; }
  .item-detail .row .row-value-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-top: 6px; padding-left: 16px; }
  .item-detail .row .row-value-grid .word-item { white-space: pre-wrap; line-height: 1.6; }
  .item-detail .detail-actions { margin-top: 10px; display: flex; gap: 14px; }

  .word-mini-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .reading-group { border: 1px solid var(--line-strong); border-radius: 3px; padding: 10px; background: var(--paper); }
  .reading-group .word-mini-row { margin-bottom: 6px; }
  .reading-group-words { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 8px 14px; }
  .word-mini-row { display: flex; gap: 6px; align-items: center; }
  .word-mini-row input { flex: 1; padding: 7px 8px; font-size: 14px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--paper); color: var(--ink); min-width: 0; }
  .word-mini-row textarea.rg-input {
    flex: 1; padding: 7px 8px; font-size: 14px; border: 1px solid var(--line-strong); border-radius: 2px;
    background: var(--paper); color: var(--ink); min-width: 0; min-height: 36px; resize: vertical;
    font-family: inherit; line-height: 1.4;
  }
  .word-mini-row select { flex: 0 0 72px; padding: 7px 4px; font-size: 13px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--paper); color: var(--ink); }

  .empty-note { color: var(--muted); font-size: 13.5px; padding: 20px 0; text-align: center; }

  /* Login screen */
  .login-card { background: var(--paper-card); border: 1px solid var(--line-strong); border-radius: 3px; padding: 28px 24px; }
  .login-card h1 { font-size: 22px; margin: 0 0 4px; }
  .login-card p.sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .login-card label { font-size: 12px; color: var(--muted); display: block; margin: 12px 0 4px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--paper); color: var(--ink); font-size: 14px; }
  .login-card .login-actions { display: flex; gap: 8px; margin-top: 18px; }
  .login-card .login-actions button { flex: 1; }
  .login-error { color: var(--hanko); font-size: 13px; margin-top: 10px; min-height: 18px; }

  .ai-check { margin-top: -6px; line-height: 1; }
  .ai-check button { font-size: 12px; padding: 3px 10px; line-height: 1.4; }
  .expr-set .ai-check { margin-top: 0; }
  .ai-card { margin-top: 10px; border: 1px solid var(--line-strong); border-left: 4px solid var(--indigo); background: var(--paper); padding: 12px 14px; border-radius: 2px; font-size: 14px; line-height: 1.7; }
  .ai-card.ok { border-left-color: var(--jade); }
  .ai-card.fix { border-left-color: var(--hanko); }
  .ai-verdict { font-weight: 700; margin-bottom: 6px; }
  .ai-corrected { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 16px; white-space: pre-wrap; margin: 4px 0 8px; padding: 8px 10px; background: var(--paper2); }
  .ai-explain { white-space: pre-wrap; }
  .ai-alt { margin-top: 6px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .ai-note { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .ai-err { color: var(--hanko); }
  .ai-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  .settings-gear { position: absolute; top: 2px; right: 0; background: var(--paper2); border: 1px solid var(--line-strong); border-radius: 50%; width: 38px; height: 38px; font-size: 18px; line-height: 1; cursor: pointer; padding: 0; }
  .settings-gear:hover { background: var(--paper-card); }
  #settings-overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 40px 14px; overflow-y: auto; }
  .settings-box { width: 100%; max-width: 520px; background: var(--paper-card); border: 1px solid var(--line-strong); border-radius: 4px; padding: 20px 22px 24px; }
  .settings-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .settings-head h2 { margin: 0; font-size: 20px; }
  .settings-section { border-top: 1px dashed var(--line-strong); padding: 14px 0 4px; margin-top: 14px; }
  .settings-section h3 { margin: 0 0 8px; font-size: 14px; }
  .settings-box .theme-dot { width: 26px; height: 26px; }

  #global-results { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 30; max-height: 60vh; overflow-y: auto; background: var(--paper-card); border: 1px solid var(--line-strong); border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }

</style>

    <div class="login-actions">

<div id="app">

    </div>

    <div class="global-search"><input type="search" id="global-search" placeholder="🔍 전체 검색 (단어 · 한자 · 문법 · 표현 · 주제)" autocomplete="off"><div id="global-results" class="hidden"></div></div>

    </div>

<script>
// firebaseConfig는 firebase-config.js에서 옵니다 (이 파일 자체는 수정할 필요 없어요).
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const firestore = firebase.firestore();

// 로그인 상태를 이 브라우저에 계속 저장해서, 창을 닫았다 다시 열어도
// 로그아웃을 누르기 전까지는 로그인 화면이 다시 뜨지 않도록 함.
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(e){
  console.error('로그인 유지 설정 실패', e);
});

(function(){
  "use strict";

  var THEME_KEY = 'jp_study_theme_v1';
  var INTERVALS = [1, 2, 4, 7, 14, 30, 60];

  var CATS = {
    vocab:   { label: '단어', color:'cat-vocab' },
    kanji:   { label: '한자', color:'cat-kanji' },
    grammar: { label: '문법', color:'cat-grammar' },
    expr:    { label: '표현', color:'cat-expr' }
  };
  var TAB_ORDER = ['review','vocab','kanji','grammar','expr'];

  var THEMES = [
    { key:'light',  label:'라이트', dot:'#FFFFFF' },
    { key:'dark',   label:'다크',   dot:'#1E1B17' },
    { key:'blue',   label:'블루',   dot:'#3D6FA6' },
    { key:'green',  label:'그린',   dot:'#4C8B63' },
    { key:'red',    label:'레드',   dot:'#B5453B' },
    { key:'yellow', label:'옐로우', dot:'#D9A73B' },
    { key:'purple', label:'퍼플',   dot:'#8B5FB0' }
  ];

  var FIELD_DEFS = {
    vocab: [
      { key:'word', label:'단어', type:'textarea' },
      { key:'reading', label:'읽기', type:'textarea' },
      { key:'meaning', label:'뜻', type:'textarea' },
      { key:'example', label:'예문', type:'textarea', full:true },
      { key:'note', label:'비고', type:'textarea', full:true },
      { key:'mySentence', label:'나만의 문장 (검수 완료본)', type:'textarea', full:true }
    ],
    kanji: [
      { key:'kanji', label:'한자', type:'kanji' },
      { key:'meaning', label:'뜻', type:'textarea' },
      { key:'note', label:'비고', type:'textarea', full:true }
    ],
    grammar: [
      { key:'pattern', label:'문형', type:'textarea' },
      { key:'topic', label:'주제', type:'text' },
      { key:'conjugation', label:'접속 형태', type:'textarea', full:true },
      { key:'meaning', label:'의미', type:'textarea', full:true },
      { key:'example', label:'예문', type:'textarea', full:true },
      { key:'note', label:'비고', type:'textarea', full:true },
      { key:'mySentence', label:'나만의 문장 (검수 완료본)', type:'textarea', full:true }
    ],
    expr: [
      { key:'expr', label:'표현', type:'textarea' },
      { key:'meaning', label:'의미', type:'textarea' },
      { key:'topic', label:'주제', type:'text' },
      { key:'example', label:'예문', type:'textarea', full:true },
      { key:'note', label:'비고', type:'textarea', full:true },
      { key:'mySentence', label:'나만의 문장 (검수 완료본)', type:'textarea', full:true }
    ]
  };

  // ---------- 한자 예시 단어 헬퍼 ----------
  // 예시 단어 한 개를 복사하되, 복습 진행 상태(레벨/다음 복습일/틀린 횟수 등)는 그대로 유지함.
  // (수정 폼을 열었다 저장해도 복습 기록이 날아가지 않도록)
  function copyWord(w){
    var o = { word: w.word || '', reading: w.reading || '', meaning: w.meaning || '' };
    ['box', 'next', 'wrongCount', 'lastReviewedDate', 'created'].forEach(function(k){
      if (w[k] !== undefined) o[k] = w[k];
    });
    return o;
  }
  function makeEmptyWords(n){
    var a = [];
    for (var i = 0; i < n; i++) a.push({ word:'', reading:'', meaning:'' });
    return a;
  }
  // 한자 항목의 readings를 항상 "중첩 형태"로 저장된 상태로 맞춰줌 (예전 방식 데이터도 변환).
  // 단어별 복습 기록을 단어 객체에 직접 저장하기 위해 필요함.
  function ensureNested(it){
    if (Array.isArray(it.readings) && it.readings.length && Array.isArray(it.readings[0].words)) return it.readings;
    var groups = getReadingGroups(it);
    if (groups.length) it.readings = groups;
    return it.readings || [];
  }
  function wordKey(w){ return (w.word || '').trim() + '|' + (w.reading || '').trim(); }

  // 한자 읽기 목록을 통일된 형태로 반환: {type:'on'|'kun', reading, words}[]
  // 신규 항목은 it.readings를 바로 쓰고, 예전 방식(onyomi/kunyomi/example 단일 필드)으로
  // 저장된 항목은 자동으로 변환해서 보여줌 — 기존 데이터는 그대로 안전하게 남아있음.
  // 한자 읽기 구조(교재 방식): 음독/훈독 "기본 읽기"가 여러 개 있을 수 있고,
  // 그 읽기마다 예시 단어가 여러 개 딸려있음. 각 단어는 자기 고유의 읽기도 따로 가짐
  // (예: 음독 さん → 三(さん), 三角形(さんかくけい), 三時(さんじ) ...).
  // 항상 이 중첩 형태로 정규화해서 반환: {type:'on'|'kun', reading, words:[{word,reading,meaning}]}[]
  // 예전 세 가지 저장 방식도 자동 변환해서 보여줌 — 기존 데이터는 그대로 안전함.
  function getReadingGroups(it){
    if (Array.isArray(it.readings) && it.readings.length){
      var first = it.readings[0];
      if (Array.isArray(first.words)){
        // 최신(중첩) 형태
        return it.readings.map(function(g){
          return {
            type: g.type || 'on', reading: g.reading || '',
            words: (g.words || []).map(copyWord)
          };
        });
      }
      if (typeof first.word !== 'undefined'){
        // 직전 버전: 평면(단어 1개=1행) 형태 -> type+reading으로 묶어서 그룹화
        var groups = {}, order = [];
        it.readings.forEach(function(e){
          var key = e.type + '|' + e.reading;
          if (!groups[key]){ groups[key] = { type:e.type, reading:e.reading, words:[] }; order.push(key); }
          groups[key].words.push({ word:e.word||'', reading:e.reading||'', meaning:e.meaning||'' });
        });
        return order.map(function(k){ return groups[k]; });
      }
      if (typeof first.words === 'string'){
        // 그 전전 버전: {type,reading,words:"쉼표,구분"}
        return it.readings.map(function(g){
          var words = (g.words || '').split(',').map(function(w){ return w.trim(); }).filter(Boolean);
          return { type:g.type, reading:g.reading||'', words: words.map(function(w){ return { word:w, reading:'', meaning:'' }; }) };
        });
      }
    }
    // 아주 예전: onyomi/kunyomi/example 단일 필드
    var out = [];
    if (it.onyomi) out.push({ type:'on', reading: it.onyomi, words: it.example ? [{ word: it.example, reading:'', meaning:'' }] : [] });
    if (it.kunyomi) out.push({ type:'kun', reading: it.kunyomi, words: (!it.onyomi && it.example) ? [{ word: it.example, reading:'', meaning:'' }] : [] });
    return out;
  }
  // 입력한 순서와 상관없이 목록/복습에서는 항상 음독을 먼저, 훈독을 나중에 보여줌.
  function sortedReadingGroups(it){
    var groups = getReadingGroups(it).slice();
    var rank = { on: 0, kun: 1 };
    groups.sort(function(a, b){ return (rank[a.type] || 0) - (rank[b.type] || 0); });
    return groups;
  }
  function rowLabelClass(label){
    if (label === '음독') return ' label-on';
    if (label === '훈독') return ' label-kun';
    return '';
  }
  function formatKanjiWordItems(words){
    return words.map(function(w){
      var s = w.word || '';
      if (w.reading) s += '[' + w.reading + ']';
      if (w.meaning) s += ' ' + w.meaning;
      return s;
    }).filter(function(s){ return s; });
  }
  function formatKanjiWordList(words){
    return formatKanjiWordItems(words).join('\n');
  }
  function renderDetailRow(r){
    var valueHtml;
    if (r[3] && r[3].length){
      valueHtml = '<div class="row-value-grid">' + r[3].map(function(w){
        return '<div class="word-item">'+esc(w)+'</div>';
      }).join('') + '</div>';
    } else {
      valueHtml = '<span class="row-value">'+esc(r[1])+'</span>';
    }
    return '<div class="row"><b class="'+rowLabelClass(r[0]).trim()+'">'+esc(r[0])+'</b>'+(r[2]?'<span class="row-inline">'+esc(r[2])+'</span>':'')+valueHtml+'</div>';
  }
  var TITLE_KEY = { vocab:'word', kanji:'kanji', grammar:'pattern', expr:'expr' };
  var SUB_KEY = { vocab:'reading', kanji:'onyomi', grammar:'conjugation', expr:null };
  var ADD_LABEL = { vocab:'단어 추가', kanji:'한자 추가', grammar:'문법 추가', expr:'표현 추가' };

  var TOPIC_CATS = ['expr', 'grammar'];
  function isTopicCat(c){ return TOPIC_CATS.indexOf(c) !== -1; }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function addDays(dateStr, n){
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function shortDate(dateStr){ return dateStr ? dateStr.slice(5) : ''; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function emptyData(){ return { vocab: [], kanji: [], grammar: [], expr: [] }; }
  var data = emptyData();

  // ---------- Firestore layer ----------
  // Layout: users/{uid}/categories/{vocab|kanji|grammar|expr}  ->  { items: [...] }
  //         users/{uid}/categories/settings                    ->  { theme: "..." }
  var fsUid = null;
  var catRefs = {};
  var settingsRef = null;
  var unsubscribers = [];

  function catCollection(userId){ return firestore.collection('users').doc(userId).collection('categories'); }

  function attachFirestore(userId){
    fsUid = userId;
    var coll = catCollection(userId);
    Object.keys(CATS).forEach(function(cat){
      var ref = coll.doc(cat);
      catRefs[cat] = ref;
      var unsub = ref.onSnapshot(function(snap){
        var d = snap.exists ? snap.data() : null;
        data[cat] = (d && Array.isArray(d.items)) ? d.items : [];
        if (state.activeTab === 'review' && state.reviewQueue){
          // 복습이 진행 중이면 화면을 다시 그리지 않음 — 채점 직후 오는 저장 확인
          // 신호 때문에 카드가 새로 렌더링되면서 탭/스와이프가 씹히는 걸 막음.
          return;
        }
        if (state.activeTab === cat && document.getElementById(cat + '-list-container')){
          // 이 탭을 입력 중이면 폼은 그대로 두고 목록만 갱신 — Ctrl+Enter 저장 직후
          // 맞춰둔 포커스(키보드)가 이 재렌더링 때문에 풀리지 않도록 함.
          renderTabs();
          refreshListOnly(cat);
        } else {
          renderAll();
        }
      }, function(err){ console.error('snapshot error', cat, err); setSyncBadge('error'); });
      unsubscribers.push(unsub);
    });
    settingsRef = coll.doc('settings');
    var unsubSettings = settingsRef.onSnapshot(function(snap){
      if (!snap.exists) return;
      var d = snap.data();
      if (d.theme && d.theme !== state.theme) applyTheme(d.theme, false);
      if (d.streak && d.streak.count !== state.streak.count){
        state.streak = d.streak;
        renderStreakBadge();
        if (state.activeTab === 'review' && !state.reviewQueue) renderReview();
      }
      var aiChanged = false;
      if (d.aiKey !== undefined && (d.aiKey || '') !== state.aiKey){ state.aiKey = d.aiKey || ''; aiChanged = true; }
      if (d.aiModel && d.aiModel !== state.aiModel){ state.aiModel = d.aiModel; aiChanged = true; }
      if (aiChanged) renderSettings();
      if (d.autoSpeak !== undefined && d.autoSpeak !== state.autoSpeak){
        state.autoSpeak = !!d.autoSpeak;
        if (state.activeTab === 'review' && !state.reviewQueue) renderReview();
      }
      if (d.includeEword !== undefined && d.includeEword !== state.includeEword){
        state.includeEword = !!d.includeEword;
        renderTabs();
        if (state.activeTab === 'review' && !state.reviewQueue) renderReview();
      }
      if (d.includeKword !== undefined && d.includeKword !== state.includeKword){
        state.includeKword = !!d.includeKword;
        renderTabs();
        if (state.activeTab === 'review' && !state.reviewQueue) renderReview();
      }
      if (d.dailyCap !== undefined && d.dailyCap !== state.dailyCap){
        state.dailyCap = d.dailyCap;
        if (state.activeTab === 'review' && !state.reviewQueue) renderReview();
      }
    }, function(err){ console.error('settings snapshot error', err); });
    unsubscribers.push(unsubSettings);
    setSyncBadge('synced');
  }
  function detachFirestore(){
    unsubscribers.forEach(function(u){ u(); });
    unsubscribers = [];
    catRefs = {};
    settingsRef = null;
    fsUid = null;
    data = emptyData();
    state.aiKey = '';
    state.streak = { count: 0, lastDate: null };
    renderStreakBadge();
  }
  function pushCategory(cat){
    if (!catRefs[cat]) return;
    catRefs[cat].set({ items: data[cat] }).catch(function(e){
      console.error('save failed', cat, e);
      setSyncBadge('error');
    });
  }
  function setSyncBadge(status){
    var el = document.getElementById('sync-badge');
    if (!el) return;
    var map = {
      synced: { text: '☁️ 동기화됨', title: 'Firestore에 실시간으로 저장돼요. 다른 기기에서 같은 계정으로 로그인하면 그대로 보여요.' },
      error: { text: '⚠️ 저장 오류 (연결 확인 필요)', title: 'Firestore 저장에 실패했어요. 콘솔의 오류 메시지와 보안 규칙을 확인해보세요.' }
    };
    var m = map[status] || { text: '', title: '' };
    el.textContent = m.text;
    el.title = m.title;
  }

  function addItem(cat, fields){
    var item = Object.assign({ id: uid(), created: todayStr(), box: 0, next: todayStr() }, fields);
    data[cat].push(item);
    pushCategory(cat);
    renderAll();
  }
  function updateItem(cat, id, fields){
    var it = data[cat].find(function(x){ return x.id === id; });
    if (!it) return;
    Object.assign(it, fields);
    pushCategory(cat);
    renderAll();
  }
  function deleteItem(cat, id){
    data[cat] = data[cat].filter(function(it){ return it.id !== id; });
    pushCategory(cat);
    renderAll();
  }
  function dueItems(cat){
    var t = todayStr();
    return data[cat].filter(function(it){ return it.next <= t; });
  }
  function dueCount(cat){ return dueItems(cat).length; }

  // ---------- 한자 예시 단어 복습 ----------
  // 한자 항목 안에 들어있는 예시 단어들을 "단어 복습"처럼 따로 복습할 수 있게 모아줌.
  // 복습 기록(box/next/wrongCount/lastReviewedDate)은 각 예시 단어 객체 안에 직접 저장됨.
  // 같은 단어+읽기가 여러 한자에 중복으로 있으면 하나로 합쳐서 한 번만 물어보고,
  // 결과는 중복된 곳 모두에 같이 반영함.
  function kwordList(){
    var map = {}, order = [];
    data.kanji.forEach(function(k){
      ensureNested(k).forEach(function(g){
        (g.words || []).forEach(function(w){
          if (!w.word || !w.word.trim()) return;
          var key = wordKey(w);
          if (!map[key]){ map[key] = { key:key, w:w, kanji:k.kanji || '' }; order.push(key); }
          else if ((w.next || '') < (map[key].w.next || '')){ map[key].w = w; }
        });
      });
    });
    return order.map(function(key){ return map[key]; });
  }
  function kwordDue(){
    var t = todayStr();
    return kwordList().filter(function(e){ return !e.w.next || e.w.next <= t; });
  }
  function kwordWeak(){
    return kwordList().filter(function(e){ return (e.w.wrongCount || 0) >= WEAK_THRESHOLD; });
  }
  function kwordToItem(e){
    var w = e.w;
    return {
      id: 'kw:' + e.key, word: w.word, reading: w.reading || '', meaning: w.meaning || '',
      note: '한자 ' + e.kanji + ' 예시 단어', box: w.box || 0, next: w.next || todayStr()
    };
  }

  // ---------- 표현 속 "모르는 단어" 복습 ----------
  // 표현마다 딸린 모르는 단어(it.unknownWords)를 표현 복습 때 따로 카드로 내줌.
  // 단어장과는 완전히 별개라서, 철자가 같아도 표현마다 뜻이 달라도 문제없음.
  // 복습 기록(box/next/...)은 각 단어 객체 안에 저장됨.
  function ewKey(it, w, i){ return it.id + '#' + (w.id || ('i' + i)); }
  function ewordList(){
    var out = [];
    data.expr.forEach(function(it){
      (it.unknownWords || []).forEach(function(w, i){
        if (!w || !w.word || !String(w.word).trim()) return;
        out.push({ key: ewKey(it, w, i), w: w, it: it });
      });
    });
    return out;
  }
  function ewordDue(){
    var t = todayStr();
    return ewordList().filter(function(e){ return !e.w.next || e.w.next <= t; });
  }
  function ewordWeak(){
    return ewordList().filter(function(e){ return (e.w.wrongCount || 0) >= WEAK_THRESHOLD; });
  }
  function ewordToItem(e){
    var w = e.w;
    return {
      id: 'ew:' + e.key, word: w.word, reading: w.reading || '', meaning: w.meaning || '',
      note: '표현: ' + (e.it.expr || '') + (e.it.meaning ? ' (' + e.it.meaning + ')' : ''),
      topic: e.it.topic || '', box: w.box || 0, next: w.next || todayStr()
    };
  }
  function findEword(key){
    var found = null;
    data.expr.forEach(function(it){
      (it.unknownWords || []).forEach(function(w, i){ if (!found && ewKey(it, w, i) === key) found = w; });
    });
    return found;
  }
  function reviewExprWord(key, remembered){
    bumpStreak();
    var w = findEword(key);
    if (!w) return;
    var today = todayStr();
    if (w.lastReviewedDate === today) return;
    var box = remembered ? Math.min((w.box || 0) + 1, INTERVALS.length - 1) : 0;
    w.box = box;
    w.next = addDays(today, INTERVALS[box]);
    if (!remembered) w.wrongCount = (w.wrongCount || 0) + 1;
    w.lastReviewedDate = today;
    pushCategory('expr');
  }
  function copyEword(w){
    var o = { word: w.word || '', reading: w.reading || '', meaning: w.meaning || '' };
    ['id', 'box', 'next', 'wrongCount', 'lastReviewedDate'].forEach(function(k){ if (w[k] !== undefined) o[k] = w[k]; });
    return o;
  }

  function totalDue(){ return Object.keys(CATS).reduce(function(sum,c){ return sum + dueCount(c); }, 0) + (state.includeKword ? kwordDue().length : 0) + (state.includeEword ? ewordDue().length : 0); }
  function totalAll(){ return Object.keys(CATS).reduce(function(sum,c){ return sum + data[c].length; }, 0) + (state.includeKword ? kwordList().length : 0) + (state.includeEword ? ewordList().length : 0); }
  function reviewResult(cat, id, remembered){
    var it = data[cat].find(function(x){ return x.id === id; });
    if (!it) return;
    bumpStreak();
    var today = todayStr();
    if (it.lastReviewedDate === today){
      // 오늘 이미 한 번 복습한 항목 — 같은 날 또 풀어도 레벨/다음 복습일은 더 이상
      // 안 바뀌게 함(그냥 추가 연습으로만 처리). 복습 대기 조작을 막기 위함.
      return;
    }
    it.box = remembered ? Math.min(it.box + 1, INTERVALS.length - 1) : 0;
    it.next = addDays(today, INTERVALS[it.box]);
    if (!remembered) it.wrongCount = (it.wrongCount || 0) + 1;
    it.lastReviewedDate = today;
    pushCategory(cat);
  }
  // 한자 예시 단어 채점: 같은 단어+읽기를 가진 모든 예시 단어에 같이 반영.
  function reviewKanjiWord(key, remembered){
    bumpStreak();
    var today = todayStr(), changed = false;
    data.kanji.forEach(function(k){
      ensureNested(k).forEach(function(g){
        (g.words || []).forEach(function(w){
          if (!w.word || wordKey(w) !== key) return;
          if (w.lastReviewedDate === today) return; // 같은 날 중복 채점은 레벨에 반영 안 함
          var box = remembered ? Math.min((w.box || 0) + 1, INTERVALS.length - 1) : 0;
          w.box = box;
          w.next = addDays(today, INTERVALS[box]);
          if (!remembered) w.wrongCount = (w.wrongCount || 0) + 1;
          w.lastReviewedDate = today;
          changed = true;
        });
      });
    });
    if (changed) pushCategory('kanji');
  }
  // ---- 되돌리기: 채점하기 직전의 복습 기록(레벨/다음 복습일 등)을 저장해두고 복원 ----
  function pickSrs(o){ return { box:o.box, next:o.next, wrongCount:o.wrongCount, lastReviewedDate:o.lastReviewedDate }; }
  function putSrs(o, st){
    ['box','next','wrongCount','lastReviewedDate'].forEach(function(k){
      if (st[k] === undefined) delete o[k]; else o[k] = st[k];
    });
  }
  function eachKwordMatch(key, fn){
    data.kanji.forEach(function(k){
      ensureNested(k).forEach(function(g){
        (g.words || []).forEach(function(w){ if (w.word && wordKey(w) === key) fn(w); });
      });
    });
  }
  function snapshotFor(cur){
    if (cur.eword){
      var ew = findEword(cur.key);
      return { eword:true, key:cur.key, state: ew ? pickSrs(ew) : null };
    }
    if (cur.kword){
      var states = [];
      eachKwordMatch(cur.key, function(w){ states.push(pickSrs(w)); });
      return { kword:true, key:cur.key, states:states };
    }
    var it = data[cur.cat].find(function(x){ return x.id === cur.item.id; });
    return { kword:false, cat:cur.cat, id:cur.item.id, state: it ? pickSrs(it) : null };
  }
  function restoreSnapshot(snap){
    if (snap.eword){
      var ew = findEword(snap.key);
      if (ew && snap.state){ putSrs(ew, snap.state); pushCategory('expr'); }
      return;
    }
    if (snap.kword){
      var i = 0;
      eachKwordMatch(snap.key, function(w){ if (snap.states[i]) putSrs(w, snap.states[i]); i++; });
      pushCategory('kanji');
    } else if (snap.state){
      var it = data[snap.cat].find(function(x){ return x.id === snap.id; });
      if (it){ putSrs(it, snap.state); pushCategory(snap.cat); }
    }
  }
  function undoLastReview(){
    if (!state.reviewQueue || !state.reviewHistory.length) return;
    var last = state.reviewHistory.pop();
    restoreSnapshot(last.snap);
    state.reviewIdx = last.idx;
    state.reviewFlipped = true;     // 되돌린 카드는 답이 보이는 상태로 돌아와서 바로 다시 채점 가능
    state.spokenIdx = last.idx;     // 되돌릴 때는 소리 자동 재생 안 함
    renderReview();
  }
  function applyReview(cur, remembered){
    state.reviewHistory.push({ idx: state.reviewIdx, snap: snapshotFor(cur) });
    if (cur.kword) reviewKanjiWord(cur.key, remembered);
    else if (cur.eword) reviewExprWord(cur.key, remembered);
    else reviewResult(cur.cat, cur.item.id, remembered);
  }

  // ---- 백업 내보내기 / 불러오기 ----
  function exportBackup(){
    var payload = {
      app: 'jp-study-note', version: 1, exportedAt: new Date().toISOString(),
      data: { vocab:data.vocab, kanji:data.kanji, grammar:data.grammar, expr:data.expr },
      settings: { streak:state.streak, dailyCap:state.dailyCap, includeKword:state.includeKword, autoSpeak:state.autoSpeak }
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '일본어학습노트_백업_' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function readBackupFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var obj;
      try { obj = JSON.parse(reader.result); } catch(e){ alert('백업 파일을 읽을 수 없어요. (JSON 형식이 아니에요)'); return; }
      var src = obj && obj.data;
      if (!src || typeof src !== 'object'){ alert('이 앱에서 만든 백업 파일이 아닌 것 같아요.'); return; }
      var clean = {}, counts = [];
      Object.keys(CATS).forEach(function(c){
        var arr = Array.isArray(src[c]) ? src[c] : [];
        clean[c] = arr.filter(function(x){ return x && typeof x === 'object'; }).map(function(x){
          if (!x.id) x.id = uid();
          if (typeof x.box !== 'number') x.box = 0;
          if (!x.next) x.next = todayStr();
          if (!x.created) x.created = todayStr();
          return x;
        });
        counts.push(CATS[c].label + ' ' + clean[c].length);
      });
      state.pendingImport = { name:file.name, data:clean, counts:counts.join(' · ') };
      renderSettings();
    };
    reader.onerror = function(){ alert('파일을 읽는 중 오류가 났어요.'); };
    reader.readAsText(file);
  }
  function applyImport(mode){
    var p = state.pendingImport;
    if (!p) return;
    if (mode === 'replace' && !confirm('지금 데이터가 모두 백업 내용으로 바뀌어요. 정말 덮어쓸까요?')) return;
    Object.keys(CATS).forEach(function(c){
      if (mode === 'replace') data[c] = p.data[c];
      else {
        var have = {};
        data[c].forEach(function(it){ have[it.id] = true; });
        p.data[c].forEach(function(it){ if (!have[it.id]) data[c].push(it); });
      }
      pushCategory(c);
    });
    state.pendingImport = null;
    renderAll();
    renderSettings();
  }
  function bumpStreak(){
    var today = todayStr();
    if (state.streak.lastDate === today) return;
    var yesterday = addDays(today, -1);
    var newCount = (state.streak.lastDate === yesterday) ? (state.streak.count || 0) + 1 : 1;
    state.streak = { count: newCount, lastDate: today };
    if (settingsRef) settingsRef.set({ streak: state.streak }, { merge: true }).catch(function(){});
    renderStreakBadge();
  }
  function renderStreakBadge(){
    var el = document.getElementById('streak-badge');
    if (!el) return;
    el.textContent = state.streak.count > 0 ? ('🔥 연속 ' + state.streak.count + '일째 복습 중') : '';
  }
  function speakJapanese(text){
    if (!text || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      window.speechSynthesis.speak(u);
    } catch(e){ console.error('TTS failed', e); }
  }

  // ---------- Theme ----------
  var PAGE_SIZE = 10;
  var state = { activeTab: 'review', reviewQueue: null, reviewIdx: 0, reviewFlipped: false, openDetail: {}, editMode: {}, theme: 'light',
    search: { vocab:'', kanji:'', grammar:'', expr:'' },
    sortMode: { vocab:'due', kanji:'due', grammar:'topic', expr:'topic' },
    kanaFilter: { vocab:null, kanji:null, grammar:null, expr:null },
    page: { vocab:1, kanji:1, grammar:1, expr:1 },
    streak: { count: 0, lastDate: null },
    dailyCap: 30,
    includeKword: false,
    includeEword: false,
    autoSpeak: true,
    reviewHistory: [],
    spokenIdx: -1,
    settingsOpen: false,
    topicFilter: { expr:null, grammar:null },
    lastTopic: { grammar:'' },
    exprSaveMsg: '',
    pendingImport: null,
    aiKey: '',
    aiModel: 'gemini-flash-latest',
    pendingFocusCat: null,
    reviewDirection: 'mixed'
  };

  function initialTheme(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(e){}
    if (saved) return saved;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function applyTheme(theme, alsoPush){
    document.documentElement.setAttribute('data-theme', theme);
    state.theme = theme;
    try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
    if (alsoPush !== false && settingsRef){ settingsRef.set({ theme: theme }, { merge: true }).catch(function(){}); }
    renderThemeRow();
  }
  function renderThemeRow(){
    var wrap = document.getElementById('theme-row');
    if (!wrap) return;
    var html = THEMES.map(function(t){
      return '<button class="theme-dot'+(state.theme===t.key?' active':'')+'" style="background:'+t.dot+'" data-theme-btn="'+t.key+'" title="'+esc(t.label)+'" aria-label="'+esc(t.label)+'"></button>';
    }).join('');
    wrap.innerHTML = html;
    wrap.querySelectorAll('[data-theme-btn]').forEach(function(btn){
      btn.addEventListener('click', function(){ applyTheme(btn.getAttribute('data-theme-btn'), true); });
    });
  }

  // ---------- Tabs ----------
  function renderTabs(){
    var nav = document.getElementById('tabs');
    nav.innerHTML = '';
    TAB_ORDER.forEach(function(key){
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (state.activeTab === key ? ' active' : '');
      var label = key === 'review' ? '오늘의 복습' : CATS[key].label;
      var due = key === 'review' ? totalDue() : dueCount(key);
      btn.innerHTML = esc(label) + (due > 0 ? ' <span class="badge">'+due+'</span>' : '');
      btn.addEventListener('click', function(){
        state.activeTab = key;
        if (key === 'review'){ state.reviewQueue = null; state.reviewIdx = 0; state.reviewFlipped = false; }
        renderAll();
      });
      nav.appendChild(btn);
    });
  }
  function switchPanel(){
    TAB_ORDER.forEach(function(key){
      var p = document.getElementById('panel-' + key);
      if (p) p.classList.toggle('hidden', state.activeTab !== key);
    });
  }

  // ---------- Review ----------
  var TITLE_LABEL = { vocab:'단어', kanji:'한자', grammar:'문형', expr:'표현' };
  var MEANING_LABEL = { vocab:'뜻', kanji:'뜻', grammar:'의미', expr:'의미' };
  var WEAK_THRESHOLD = 2;

  function isWeak(it){ return (it.wrongCount || 0) >= WEAK_THRESHOLD; }
  function weakItems(cat){ return data[cat].filter(isWeak); }
  function totalWeak(){ return Object.keys(CATS).reduce(function(sum,c){ return sum + weakItems(c).length; }, 0) + (state.includeKword ? kwordWeak().length : 0) + (state.includeEword ? ewordWeak().length : 0); }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
    return arr;
  }
  function pickDirection(){
    if (state.reviewDirection === 'mixed') return Math.random() < 0.5 ? 'normal' : 'reverse';
    return state.reviewDirection;
  }
  function reviewTopicList(){
    var out = [], idx = {};
    function add(cat, it){
      var t = it.topic || '';
      if (!t) return;
      var k = cat + ':' + t;
      if (idx[k] === undefined){ idx[k] = out.length; out.push({ cat:cat, name:t, count:0 }); }
      out[idx[k]].count++;
    }
    data.expr.forEach(function(it){ add('expr', it); });
    ewordList().forEach(function(e){ add('expr', e.it); });
    data.grammar.forEach(function(it){ add('grammar', it); });
    return out;
  }
  function listenCount(){
    return data.vocab.length + data.expr.length + (state.includeKword ? kwordList().length : 0) + (state.includeEword ? ewordList().length : 0);
  }
  function buildQueue(mode, onlyCat){
    var q = [];
    if (onlyCat && onlyCat.indexOf('topic:') === 0){
      // 주제별 복습: 표현 주제 = 그 주제의 표현 + 표현 속 모르는 단어 / 문법 주제 = 그 주제의 문법
      var rest = onlyCat.slice(6);
      var tcat = rest.slice(0, rest.indexOf(':'));
      var tn = rest.slice(rest.indexOf(':') + 1);
      if (tcat === 'grammar'){
        data.grammar.forEach(function(it){ if ((it.topic || '') === tn) q.push({ cat:'grammar', item:it, dir:pickDirection() }); });
      } else {
        data.expr.forEach(function(it){ if ((it.topic || '') === tn) q.push({ cat:'expr', item:it, dir:pickDirection() }); });
        ewordList().forEach(function(e){
          if ((e.it.topic || '') === tn) q.push({ cat:'vocab', eword:true, key:e.key, item:ewordToItem(e), dir: e.w.meaning ? pickDirection() : 'normal' });
        });
      }
      return shuffle(q);
    }
    if (onlyCat === 'listen'){
      // 듣기 복습: 단어/표현 (+ 한자 예시 단어를 포함으로 체크했으면 그것도)
      ['vocab', 'expr'].forEach(function(c){
        data[c].forEach(function(it){ q.push({ cat:c, item:it, dir:'listen' }); });
      });
      if (state.includeKword) kwordList().forEach(function(e){
        q.push({ cat:'vocab', kword:true, key:e.key, item:kwordToItem(e), dir:'listen' });
      });
      if (state.includeEword) ewordList().forEach(function(e){
        q.push({ cat:'vocab', eword:true, key:e.key, item:ewordToItem(e), dir:'listen' });
      });
      return shuffle(q);
    }
    Object.keys(CATS).forEach(function(c){
      if (onlyCat && c !== onlyCat) return;
      var pool = mode === 'all' ? data[c] : (mode === 'weak' ? weakItems(c) : dueItems(c));
      // 한자는 방향 설정과 상관없이 항상 "한자 보고 맞추기"로 고정.
      pool.forEach(function(it){ q.push({ cat: c, item: it, dir: c === 'kanji' ? 'normal' : pickDirection() }); });
    });
    // 한자 예시 단어들도 단어 복습처럼 섞어서 출제 (뜻이 없는 단어는 일본어→뜻 방향으로만).
    if ((!onlyCat && state.includeKword) || onlyCat === 'kword'){
      var kl = mode === 'all' ? kwordList() : (mode === 'weak' ? kwordWeak() : kwordDue());
      kl.forEach(function(e){
        q.push({ cat: 'vocab', kword: true, key: e.key, item: kwordToItem(e), dir: e.w.meaning ? pickDirection() : 'normal' });
      });
    }
    // 표현 복습(항목별 '표현' 버튼)에는 표현 속 모르는 단어가 같이 나오고,
    // 오늘 복습/전체/취약 복습에는 '포함' 체크했을 때만 들어감.
    if ((!onlyCat && state.includeEword) || onlyCat === 'expr'){
      var el = mode === 'all' ? ewordList() : (mode === 'weak' ? ewordWeak() : ewordDue());
      el.forEach(function(e){
        q.push({ cat:'vocab', eword:true, key:e.key, item:ewordToItem(e), dir: e.w.meaning ? pickDirection() : 'normal' });
      });
    }
    return shuffle(q);
  }
  function startReview(mode, onlyCat){
    var queue = buildQueue(mode, onlyCat);
    if (mode === 'due' && state.dailyCap !== 'all' && queue.length > state.dailyCap){
      queue = queue.slice(0, state.dailyCap);
    }
    state.reviewQueue = queue;
    state.reviewHistory = [];
    state.spokenIdx = -1;
    state.reviewIdx = 0;
    state.reviewFlipped = false;
    renderReview();
  }
  function backRowsFor(cat, it){
    var rows;
    if (cat === 'vocab') rows = [['읽기', it.reading], ['뜻', it.meaning], ['예문', it.example], ['비고', it.note], ['나만의 문장', it.mySentence]];
    else if (cat === 'kanji') rows = readingDetailRows(it).concat([['뜻', it.meaning], ['비고', it.note]]);
    else if (cat === 'grammar') rows = [['의미', it.meaning], ['접속 형태', it.conjugation], ['예문', it.example], ['비고', it.note], ['나만의 문장', it.mySentence]];
    else {
      rows = [['의미', it.meaning], ['예문', it.example], ['비고', it.note], ['나만의 문장', it.mySentence]];
      if (it.unknownWords && it.unknownWords.length){
        rows.push(['모르는 단어', it.unknownWords.map(function(w){
          var s = w.word || ''; if (w.reading) s += '['+w.reading+']'; if (w.meaning) s += ' '+w.meaning;
          return s;
        }).join('\n')]);
      }
    }
    return rows.filter(function(r){ return r[1] && String(r[1]).trim(); });
  }

  function resetAllLevels(){
    var total = totalAll();
    if (!total) return;
    if (!confirm('단어/한자/문법/표현 전체 '+total+'개 항목의 레벨을 초기화할까요?\n내용은 그대로 남고, 레벨(Lv.1)과 다음 복습일(오늘)만 리셋돼요.')) return;
    Object.keys(CATS).forEach(function(cat){
      data[cat].forEach(function(it){
        it.box = 0;
        it.next = todayStr();
        it.wrongCount = 0;
        delete it.lastReviewedDate;
        if (cat === 'expr'){
          (it.unknownWords || []).forEach(function(w){ w.box = 0; w.next = todayStr(); w.wrongCount = 0; delete w.lastReviewedDate; });
        }
        if (cat === 'kanji'){
          // 한자 예시 단어의 복습 기록도 함께 초기화
          ensureNested(it).forEach(function(g){
            (g.words || []).forEach(function(w){
              w.box = 0; w.next = todayStr(); w.wrongCount = 0; delete w.lastReviewedDate;
            });
          });
        }
      });
      pushCategory(cat);
    });
    renderAll();
  }
  function renderStatsPanel(){
    var levels = [0,0,0,0,0,0,0];
    var total = 0;
    Object.keys(CATS).forEach(function(c){
      data[c].forEach(function(it){ levels[it.box || 0]++; total++; });
    });
    if (state.includeKword) kwordList().forEach(function(e){ levels[e.w.box || 0]++; total++; });
    if (state.includeEword) ewordList().forEach(function(e){ levels[e.w.box || 0]++; total++; });
    var streakHtml = state.streak.count > 0
      ? '<span class="streak-inline">🔥 연속 '+state.streak.count+'일째</span>' : '';
    if (!total) return streakHtml ? '<div class="stats-panel">'+streakHtml+'</div>' : '';
    var maxLv = Math.max.apply(null, levels.concat([1]));
    var bars = levels.map(function(n, i){
      var h = Math.round((n / maxLv) * 36) + 4;
      return '<div class="level-bar-col"><div class="level-bar" style="height:'+h+'px" title="Lv.'+(i+1)+': '+n+'개"></div><div class="level-bar-label">Lv'+(i+1)+'</div></div>';
    }).join('');
    return '<div class="stats-panel">' + streakHtml +
      '<div class="level-chart">'+bars+'</div>' +
      '<div class="level-chart-caption">레벨별 항목 분포 (총 '+total+'개)</div>' +
      '</div>';

        (extraButtons ? '<div class="review-start-row" style="margin-top:10px;">'+extraButtons+'</div>' : '') +
        renderKwordToggle() +
        renderEwordToggle() +
        renderSpeakToggle() +
        renderCapRow() +
        renderDirectionRow();

      var spToggle = document.getElementById('speak-toggle');
      if (spToggle) spToggle.addEventListener('change', function(){
        state.autoSpeak = spToggle.checked;
        if (settingsRef) settingsRef.set({ autoSpeak: state.autoSpeak }, { merge: true }).catch(function(){});
      });
      var ewToggle = document.getElementById('eword-toggle');
      if (ewToggle) ewToggle.addEventListener('change', function(){
        state.includeEword = ewToggle.checked;
        if (settingsRef) settingsRef.set({ includeEword: state.includeEword }, { merge: true }).catch(function(){});
        renderTabs();
        renderReview();
      });
      var kwToggle = document.getElementById('kword-toggle');
      if (kwToggle) kwToggle.addEventListener('change', function(){
        state.includeKword = kwToggle.checked;
        if (settingsRef) settingsRef.set({ includeKword: state.includeKword }, { merge: true }).catch(function(){});
        renderTabs();
        renderReview();
      });
      var dueBtn = document.getElementById('start-due');
      if (dueBtn) dueBtn.addEventListener('click', function(){ startReview('due'); });

          renderReview();
        });
      });

        btn.addEventListener('click', function(){ state.reviewDirection = btn.getAttribute('data-dir'); renderReview(); });
      });

    if (state.reviewIdx >= state.reviewQueue.length){
      var remainingAll = totalAll();

        '<div class="review-actions">' +

        (remainingAll > 0 ? '<button class="secondary" id="continue-all">전체 항목으로 이어서 복습</button>' : '') +

      document.getElementById('back-summary').addEventListener('click', function(){ state.reviewQueue = null; renderReview(); renderTabs(); });
      return;
    }
    var cur = state.reviewQueue[state.reviewIdx];
    var cat = cur.cat, it = cur.item;
    var isReverse = cur.dir === 'reverse';

    var term = it[TITLE_KEY[cat]] || '';
    var front, backRows, tagLabel, speakText;

    if (isListen){
      front = '🎧';

    } else if (isReverse){
      front = it.meaning || '';
      tagLabel = CATS[cat].label + ' · 뜻→일본어';
      speakText = term;
      backRows = [[TITLE_LABEL[cat], term]].concat(
        backRowsFor(cat, it).filter(function(r){ return r[0] !== MEANING_LABEL[cat]; })
      );
    } else {
      front = term;
      tagLabel = CATS[cat].label;
      speakText = term;
      backRows = backRowsFor(cat, it);
    }
    if (!cur.kword && it.topic && (cat === 'expr' || cat === 'vocab' || cat === 'grammar')) tagLabel += ' · ' + it.topic;
    if (cur.kword) tagLabel = '한자 단어' + (isListen ? ' · 듣기' : (isReverse ? ' · 뜻→일본어' : ''));
    if (cur.eword) tagLabel = '표현 단어' + (isListen ? ' · 듣기' : (isReverse ? ' · 뜻→일본어' : '')) + (it.topic ? ' · ' + it.topic : '');
    var progress = (state.reviewIdx+1) + ' / ' + state.reviewQueue.length;

    html += '<div class="front-row"><div class="front">'+esc(front)+'</div>';
    if (!isReverse) html += '<button type="button" class="speak-btn" id="speak-btn" title="발음 듣기">🔊</button>';
    html += '</div>';
    if (state.reviewFlipped){
      html += '<div class="back">' + backRows.map(renderDetailRow).join('') + '</div>';
      html += '<div class="swipe-hint">← 까먹었어요(←키)&nbsp;&nbsp;·&nbsp;&nbsp;기억나요(→키) →</div>';
    }
    html += '</div>';
    html += !state.reviewFlipped
      ? '<div class="review-actions"><button class="primary" id="flip-btn">답 보기</button></div><div class="swipe-hint">스페이스바로도 답을 볼 수 있어요</div>'
      : '<div class="review-actions"><button class="forgot" id="forgot-btn">까먹었어요</button><button class="remembered" id="remember-btn">기억나요</button></div>';
    if (state.reviewHistory.length) html += '<div class="review-actions" style="margin-top:10px;"><button type="button" class="secondary" id="undo-btn">↩ 직전 카드 되돌리기 (Z키)</button></div>';
    panel.innerHTML = html;

    var speakBtn = document.getElementById('speak-btn');
    if (speakBtn){
      speakBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      speakBtn.addEventListener('click', function(e){ e.stopPropagation(); speakJapanese(speakText); });
    }
    // 새 카드가 나오면 소리 자동 재생 (정답이 되는 뒷면 방향·한자 카드는 제외, 듣기 복습은 항상)
    if (state.autoSpeak && !state.reviewFlipped && state.spokenIdx !== state.reviewIdx){
      state.spokenIdx = state.reviewIdx;
      if (!isReverse && (cat !== 'kanji')) speakJapanese(speakText);
    }

    if (undoBtn) undoBtn.addEventListener('click', undoLastReview);
    var flipBtn = document.getElementById('flip-btn');
    if (flipBtn) flipBtn.addEventListener('click', function(){ state.reviewFlipped = true; renderReview(); });
    function advance(remembered){ applyReview(cur, remembered); state.reviewIdx += 1; state.reviewFlipped = false; renderReview(); }
    var forgotBtn = document.getElementById('forgot-btn');
    if (forgotBtn) forgotBtn.addEventListener('click', function(){ advance(false); });
    var rememberBtn = document.getElementById('remember-btn');
    if (rememberBtn) rememberBtn.addEventListener('click', function(){ advance(true); });

    var cardEl = document.getElementById('flashcard-el');
    if (cardEl && !state.reviewFlipped){
      cardEl.addEventListener('click', function(){ state.reviewFlipped = true; renderReview(); });
    }
    if (cardEl && state.reviewFlipped){
      bindCardSwipe(cardEl, function(){ advance(false); }, function(){ advance(true); });
    }
  }

  // 카드를 좌우로 드래그해서 답을 표시 — 오른쪽 = 기억나요, 왼쪽 = 까먹었어요.
  function bindCardSwipe(cardEl, onLeft, onRight){
    var THRESHOLD = 70;
    var dragging = false, startX = 0, startY = 0, dx = 0;
    cardEl.addEventListener('pointerdown', function(e){
      dragging = true; startX = e.clientX; startY = e.clientY; dx = 0;
      cardEl.style.transition = 'none';
      try { cardEl.setPointerCapture(e.pointerId); } catch(err){}
    });
    cardEl.addEventListener('pointermove', function(e){
      if (!dragging) return;
      dx = e.clientX - startX;
      var dy = e.clientY - startY;
      if (Math.abs(dy) > Math.abs(dx) * 1.5) return;
      cardEl.style.transform = 'translateX('+dx+'px) rotate('+(dx/18)+'deg)';
      cardEl.style.borderColor = dx > 20 ? 'var(--jade)' : (dx < -20 ? 'var(--hanko)' : '');
    });
    function endDrag(){
      if (!dragging) return;
      dragging = false;
      cardEl.style.transition = 'transform 0.2s ease, border-color 0.2s ease';
      if (dx > THRESHOLD){
        cardEl.style.transform = 'translateX(420px) rotate(16deg)';
        setTimeout(onRight, 130);
      } else if (dx < -THRESHOLD){
        cardEl.style.transform = 'translateX(-420px) rotate(-16deg)';
        setTimeout(onLeft, 130);
      } else {
        cardEl.style.transform = '';
        cardEl.style.borderColor = '';
      }
    }
    cardEl.addEventListener('pointerup', endDrag);
    cardEl.addEventListener('pointercancel', endDrag);
  }


  // ---------- Field form generation (shared by add & edit) ----------
  function fieldRowHtml(prefix, field, value){
    var id = prefix + '-' + field.key;
    var fullClass = field.full ? ' full' : '';
    if (field.type === 'kanji'){
      return '<div class="'+fullClass+'"><label for="'+id+'">'+esc(field.label)+'</label>' +
        '<div class="genko-wrap"><div class="genko-cell"><input id="'+id+'" maxlength="4" value="'+esc(value)+'"></div></div></div>';
    }
    var tag = field.type === 'textarea' ? 'textarea' : 'input';
    var inner = field.type === 'textarea' ? esc(value) : '';
    var valueAttr = field.type === 'textarea' ? '' : ' value="'+esc(value)+'"';
    return '<div class="'+fullClass.trim()+'"><label for="'+id+'">'+esc(field.label)+'</label>' +
      '<'+tag+' id="'+id+'"'+(field.type==='textarea'?'':' type="text"')+valueAttr+'>'+inner+'</'+tag+'>' +
      '</div>';
  }
  function generateFormFields(cat, prefix, existing){
    var fields = FIELD_DEFS[cat];
    var firstHtml = fieldRowHtml(prefix, fields[0], existing ? existing[fields[0].key] : '');
    var warningHtml = '<div class="full dup-warning" id="'+prefix+'-dup-warning"></div>';
    var topicHtml = '';   // 주제 칸은 항상 맨 앞에 보여줌 (문형/표현보다 먼저)
    var restHtml = fields.slice(1).map(function(f){
      var val = existing ? existing[f.key] : '';
      if (!existing && f.key === 'topic') val = (state.lastTopic && state.lastTopic[cat]) || '';
      var h = fieldRowHtml(prefix, f, val);
      if (f.key === 'topic'){
        h = h.replace('<input ', '<input list="topic-list-'+prefix+'" autocomplete="off" placeholder="주제 (이어서 쓰면 자동으로 채워져요)" ') +
          '<datalist id="topic-list-'+prefix+'">' + topicList(cat).map(function(t){ return '<option value="'+esc(t)+'">'; }).join('') + '</datalist>';
      }
      if (f.key === 'mySentence') h += aiBoxHtml(prefix);
      if (f.key === 'topic'){ topicHtml = h; return ''; }
      return h;
    }).join('');
    return topicHtml + firstHtml + warningHtml + restHtml;
  }
  function readFormFields(cat, prefix){
    var out = {};
    FIELD_DEFS[cat].forEach(function(f){
      var el = document.getElementById(prefix + '-' + f.key);
      out[f.key] = el ? el.value.trim() : '';
    });
    return out;
  }
  function findDuplicate(cat, value, excludeId){
    value = (value || '').trim();
    if (!value) return null;
    return data[cat].find(function(it){
      return it.id !== excludeId && (it[TITLE_KEY[cat]] || '').trim() === value;
    }) || null;
  }
  function bindDuplicateCheck(cat, prefix, excludeId){
    var titleInput = document.getElementById(prefix + '-' + TITLE_KEY[cat]);
    var warnEl = document.getElementById(prefix + '-dup-warning');
    if (!titleInput || !warnEl) return;
    function check(){
      var dup = findDuplicate(cat, titleInput.value, excludeId);
      warnEl.innerHTML = dup
        ? '⚠️ 이미 등록된 항목이에요 — 뜻: '+esc(dup.meaning||'(없음)')+' · 등록 '+shortDate(dup.created)
        : '';
    }
    titleInput.addEventListener('input', check);
    check();
  }

  function aiCheckSentence(cat, f, sentence){
    var kindLabel = { vocab:'단어', grammar:'문형', expr:'표현' }[cat] || '항목';
    var lines = ['학습 항목 종류: ' + kindLabel, '항목: ' + (f[TITLE_KEY[cat]] || '')];
    if (f.reading) lines.push('읽기: ' + f.reading);
    if (f.conjugation) lines.push('접속 형태: ' + f.conjugation);
    if (f.meaning) lines.push('뜻: ' + f.meaning);
    lines.push('', '학습자가 쓴 문장:', sentence);
    var body = {
      systemInstruction: { parts: [{ text: AI_SYSTEM }] },
      contents: [{ role: 'user', parts: [{ text: lines.join('\n') }] }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0.2 }
    };
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(state.aiModel) + ':generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.aiKey },
      body: JSON.stringify(body)
    }).then(function(res){
      return res.json().then(function(j){ return { ok:res.ok, status:res.status, j:j }; }, function(){ return { ok:res.ok, status:res.status, j:null }; });
    }).then(function(r){
      if (!r.ok){
        var msg = (r.j && r.j.error && r.j.error.message) ? r.j.error.message : ('오류 ' + r.status);
        if (r.status === 400 || r.status === 403) msg = 'API 키나 모델 이름에 문제가 있는 것 같아요. (복습 탭 맨 아래 "AI 검수 설정"에서 확인) — ' + msg;
        else if (r.status === 429) msg = '요청 한도를 넘었어요. 잠시 뒤에 다시 시도해 주세요.';
        throw new Error(msg);
      }
      var parts = (r.j && r.j.candidates && r.j.candidates[0] && r.j.candidates[0].content && r.j.candidates[0].content.parts) || [];
      var text = parts.map(function(p){ return p.text || ''; }).join('').replace(/```json|```/g, '').trim();
      var parsed;
      try { parsed = JSON.parse(text); } catch(e){ throw new Error('AI 응답을 해석하지 못했어요. 한 번 더 눌러 주세요.'); }
      return parsed;
    });
  }
  function renderAiResult(out, ta, sentence, r){
    var corrected = (r.corrected && String(r.corrected).trim()) || sentence;
    var isFix = r.verdict === 'fix' && corrected !== sentence;
    var html = '<div class="ai-card ' + (isFix ? 'fix' : 'ok') + '">' +
      '<div class="ai-verdict">' + (isFix ? '✏️ 이렇게 고치면 좋아요' : '✅ 자연스러운 문장이에요') + '</div>';
    if (isFix) html += '<div class="ai-corrected">' + esc(corrected) + '</div>';
    if (r.explain) html += '<div class="ai-explain">' + esc(r.explain) + '</div>';
    if (r.usesTarget === false) html += '<div class="ai-note ai-err">⚠️ 학습 중인 항목이 문장에서 제대로 쓰이지 않은 것 같아요.</div>';
    if (r.alt && String(r.alt).trim()) html += '<div class="ai-alt">다른 표현: ' + esc(r.alt) + '</div>';
    if (isFix) html += '<div class="ai-actions"><button type="button" class="primary" data-ai-apply="1">교정본 적용</button></div>';
    html += '</div>';
    out.innerHTML = html;
    var applyBtn = out.querySelector('[data-ai-apply]');
    if (applyBtn) applyBtn.addEventListener('click', function(){
      ta.value = corrected;
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      applyBtn.disabled = true;
      applyBtn.textContent = '적용했어요 ✓';
    });
  }

  function submitExprForm(){
    var topic = (document.getElementById('add-expr-topic').value || '').trim();
    var today = todayStr();
    var existing = {}, maxSeq = 0;
    data.expr.forEach(function(it){
      existing[(it.topic || '') + '|' + (it.expr || '').trim()] = true;
      if ((it.topic || '') === topic && (it.seq || 0) > maxSeq) maxSeq = it.seq;
    });
    var exprItems = [], skipE = 0, wordCount = 0;
    document.querySelectorAll('#add-expr-rows .expr-set').forEach(function(r){
      var pf = 'add-expr-r' + r.getAttribute('data-row');
      function v(k){ var el = document.getElementById(pf + '-' + k); return el ? el.value.trim() : ''; }
      var e = v('expr');
      if (!e) return;
      var key = topic + '|' + e;
      if (existing[key]){ skipE++; return; }
      existing[key] = true;
      var words = [];
      r.querySelectorAll('.uw-row').forEach(function(wr){
        function wv(k){ var el = wr.querySelector('[data-f="' + k + '"]'); return el ? el.value.trim() : ''; }
        var w = wv('word');
        if (w) words.push({ id:uid(), word:w, reading:wv('reading'), meaning:wv('meaning') });
      });
      var item = { id:uid(), created:today, box:0, next:today, expr:e, meaning:v('meaning'), example:v('example'),
        note:'', mySentence:v('mySentence'), topic:topic, seq:++maxSeq };
      if (words.length){ item.unknownWords = words; wordCount += words.length; }
      exprItems.push(item);
    });
    if (!exprItems.length){
      alert(skipE ? '이미 등록된 표현이라 새로 저장할 게 없어요.' : '저장할 표현을 먼저 입력해 주세요.');
      return;
    }
    exprItems.forEach(function(it){ data.expr.push(it); });
    pushCategory('expr');
    state.exprSaveMsg = '✅ 표현 ' + exprItems.length + '개' + (wordCount ? ' (모르는 단어 ' + wordCount + '개 포함)' : '') + ' 저장했어요.' + (skipE ? ' (이미 있는 표현 ' + skipE + '개는 건너뜀)' : '');
    state.topicFilter.expr = topic ? topic : null;
    state.sortMode.expr = 'topic';
    state.page.expr = 1;
    state.pendingFocusCat = 'expr';
    renderAll();
  }
  function renderTopicRow(cat){
    cat = cat || 'expr';
    var wrap = document.getElementById(cat + '-topic-row');
    if (!wrap) return;
    var tf = state.topicFilter;
    var topics = [], seen = {}, hasNone = false;
    data[cat].forEach(function(it){
      var t = it.topic || '';
      if (!t){ hasNone = true; return; }
      if (!seen[t]){ seen[t] = true; topics.push(t); }
    });
    if (tf[cat] !== null && tf[cat] !== '' && !seen[tf[cat]]) tf[cat] = null;
    if (tf[cat] === '' && !hasNone) tf[cat] = null;
    if (!topics.length && !hasNone){ wrap.innerHTML = ''; return; }
    var chips = ['<button type="button" class="kana-chip'+(tf[cat] === null ? ' active' : '')+'" data-topic-all="1">전체 주제</button>'];
    topics.forEach(function(t){
      chips.push('<button type="button" class="kana-chip'+(tf[cat] === t ? ' active' : '')+'" data-topic="'+esc(t)+'">'+esc(t)+'</button>');
    });
    if (hasNone) chips.push('<button type="button" class="kana-chip'+(tf[cat] === '' ? ' active' : '')+'" data-topic="">주제 없음</button>');
    wrap.innerHTML = chips.join('');
    wrap.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        tf[cat] = btn.hasAttribute('data-topic-all') ? null : btn.getAttribute('data-topic');
        state.page[cat] = 1;
        refreshListOnly(cat);
      });
    });
  }

  // ---------- Category panels ----------

          .map(function(g){ return { type:g.type, reading:(g.reading||'').trim(), words: g.words.filter(function(w){ return w.word && w.word.trim(); }) }; })
          .filter(function(g){ return g.reading || g.words.length; });
        if (cat === 'grammar'){
          var ms = 0;
          data.grammar.forEach(function(g){ if ((g.topic || '') === (fields.topic || '') && (g.seq || 0) > ms) ms = g.seq; });
          fields.seq = ms + 1;
          state.lastTopic.grammar = fields.topic || '';   // 같은 주제로 이어서 쓸 수 있게 기억

  function renderSortRow(cat){
    var wrap = document.getElementById(cat + '-sort-row');
    if (!wrap) return;
    wrap.innerHTML =
      (isTopicCat(cat) ? '<button data-sort="topic" class="'+(state.sortMode[cat]==='topic'?'active':'')+'">주제순</button>' : '') +
      '<button data-sort="due" class="'+(state.sortMode[cat]==='due'?'active':'')+'">복습순</button>' +
      '<button data-sort="created" class="'+(state.sortMode[cat]==='created'?'active':'')+'">등록순</button>' +
      '<button data-sort="kana" class="'+(state.sortMode[cat]==='kana'?'active':'')+'">발음순 (あいうえお)</button>';
    wrap.querySelectorAll('[data-sort]').forEach(function(btn){
      btn.addEventListener('click', function(){

        refreshListOnly(cat);
      });

  function renderKanaRow(cat){
    var wrap = document.getElementById(cat + '-kana-row');
    if (!wrap) return;
    var keys = KANA_ROWS.map(function(r){ return r.key; }).concat(['기타']);
    wrap.innerHTML = keys.map(function(k){
      return '<button class="kana-chip'+(state.kanaFilter[cat]===k?' active':'')+'" data-kana="'+esc(k)+'">'+esc(k)+'</button>';
    }).join('');
    wrap.querySelectorAll('[data-kana]').forEach(function(btn){
      btn.addEventListener('click', function(){

        renderKanaRow(cat);
