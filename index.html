  function sortIsNotTopic(cat){ return !(isTopicCat(cat) && state.sortMode[cat] === 'topic'); }
  function refreshListOnly(cat){
    var container = document.getElementById(cat + '-list-container');
    if (!container) return;
    if (isTopicCat(cat)) renderTopicRow(cat);
    container.innerHTML = renderListMarkup(cat);
    bindListEvents(cat);
  }

  function boxDisplay(it){ return '<span class="box-chip">Lv.'+ (it.box+1) +'</span>'; }

  var KANA_ROWS = [
    { key:'あ', chars:'あいうえおぁぃぅぇぉ' },
    { key:'か', chars:'かきくけこがぎぐげご' },
    { key:'さ', chars:'さしすせそざじずぜぞ' },
    { key:'た', chars:'たちつてとだぢづでどっ' },
    { key:'な', chars:'なにぬねの' },
    { key:'は', chars:'はひふへほばびぶべぼぱぴぷぺぽ' },
    { key:'ま', chars:'まみむめも' },
    { key:'や', chars:'やゆよゃゅょ' },
    { key:'ら', chars:'らりるれろ' },
    { key:'わ', chars:'わをん' }
  ];
  function toHiragana(ch){
    var code = ch.codePointAt(0);
    if (code >= 0x30A1 && code <= 0x30FA) return String.fromCharCode(code - 0x60);
    return ch;
  }
  function kanaRowOf(str){
    if (!str) return null;
    var ch = toHiragana(str.trim().charAt(0));
    for (var i = 0; i < KANA_ROWS.length; i++){
      if (KANA_ROWS[i].chars.indexOf(ch) !== -1) return KANA_ROWS[i].key;
    }
    return null; // 한자·로마자 등 가나로 시작하지 않는 항목 -> "기타"
  }
  function readingKeyOf(cat, it){
    if (cat === 'vocab') return it.reading || it.word || '';
    if (cat === 'kanji'){
      var groups = getReadingGroups(it);
      return (groups[0] && groups[0].reading) || it.kanji || '';
    }
    if (cat === 'grammar') return it.pattern || '';
    return it.expr || '';
  }
  function searchableText(cat, it){
    var parts = [it[TITLE_KEY[cat]], it.meaning, it.example, it.note, it.mySentence, it.topic];
    if (cat === 'vocab') parts.push(it.reading);
    if (cat === 'kanji') getReadingGroups(it).forEach(function(g){
      parts.push(g.reading);
      g.words.forEach(function(w){ parts.push(w.word, w.reading, w.meaning); });
    });
    if (cat === 'grammar') parts.push(it.conjugation);
    if (cat === 'expr' && it.unknownWords) it.unknownWords.forEach(function(w){ parts.push(w.word, w.reading, w.meaning); });
    return parts.filter(Boolean).join(' ').toLowerCase();
  }
  function filteredSortedItems(cat){
    var items = data[cat].slice();
    var term = (state.search[cat] || '').trim().toLowerCase();
    if (term) items = items.filter(function(it){ return searchableText(cat, it).indexOf(term) !== -1; });
    if (isTopicCat(cat) && state.topicFilter[cat] !== null){
      items = items.filter(function(it){ return (it.topic || '') === state.topicFilter[cat]; });
    }
    var kf = state.kanaFilter[cat];
    if (kf) items = items.filter(function(it){ return kanaRowOf(readingKeyOf(cat, it)) === (kf === '기타' ? null : kf); });
    if (isTopicCat(cat) && state.sortMode[cat] === 'topic'){
      var rank = {}, rn = 0;
      data[cat].forEach(function(it){ var k = it.topic || ''; if (rank[k] === undefined) rank[k] = rn++; });
      items.sort(function(a,b){
        var ra = rank[a.topic || ''], rb = rank[b.topic || ''];
        if (ra !== rb) return ra - rb;
        if ((a.seq || 0) !== (b.seq || 0)) return (a.seq || 0) - (b.seq || 0);
        if (a.created !== b.created) return a.created < b.created ? -1 : 1;
        return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
      });
    } else if (state.sortMode[cat] === 'kana'){
      items.sort(function(a,b){ return readingKeyOf(cat,a).localeCompare(readingKeyOf(cat,b), 'ja'); });
    } else if (state.sortMode[cat] === 'created'){
      items.sort(function(a,b){
        if (a.created !== b.created) return a.created < b.created ? -1 : 1;
        if ((a.seq || 0) !== (b.seq || 0)) return (a.seq || 0) - (b.seq || 0);
        return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
      });
    } else {
      items.sort(function(a,b){ return a.next < b.next ? -1 : 1; });
    }
    return items;
  }
  function subDisplay(cat, it){
    if (cat === 'kanji'){
      var groups = getReadingGroups(it);
      var onList = groups.filter(function(g){ return g.type === 'on'; }).map(function(g){ return g.reading; }).filter(Boolean);
      var kunList = groups.filter(function(g){ return g.type === 'kun'; }).map(function(g){ return g.reading; }).filter(Boolean);
      var parts = [];
      if (onList.length) parts.push('음: ' + onList.join('・'));
      if (kunList.length) parts.push('훈: ' + kunList.join('・'));
      return parts.join('  ');
    }
    if (cat === 'grammar'){
      // 접속 형태가 여러 줄이면 목록에서는 첫 줄만 보여줌 (펼치면 전부 나와요)
      var cl = String(it.conjugation || '').split('\n').filter(function(x){ return x.trim(); });
      return cl.length > 1 ? cl[0] + ' …' : (cl[0] || '');
    }
    return SUB_KEY[cat] ? it[SUB_KEY[cat]] : '';
  }

  function renderListMarkup(cat){
    var allItems = filteredSortedItems(cat);
    if (!allItems.length){
      var hasAny = data[cat].length > 0;
      return '<div class="empty-note">'+(hasAny ? '조건에 맞는 항목이 없어요.' : '아직 추가된 '+CATS[cat].label+' 항목이 없어요.')+'</div>';
    }
    var totalPages = Math.max(1, Math.ceil(allItems.length / PAGE_SIZE));
    if (state.page[cat] > totalPages) state.page[cat] = totalPages;
    if (state.page[cat] < 1) state.page[cat] = 1;
    var page = state.page[cat];
    var items = allItems.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    var t = todayStr();
    var prevTopic = null;
    var topicCounts = {};
    allItems.forEach(function(x){ var k = x.topic || ''; topicCounts[k] = (topicCounts[k] || 0) + 1; });
    var rows = items.map(function(it){
      var headHtml = '';
      if (isTopicCat(cat) && state.sortMode[cat] === 'topic'){
        var tk = it.topic || '';
        if (tk !== prevTopic){
          headHtml = '<div class="topic-head">' + (cat === 'grammar' ? '📗 ' : '📘 ') + esc(tk || '주제 없음') + '<span>' + topicCounts[tk] + '개</span></div>';
          prevTopic = tk;
        }
      }
      var isDue = it.next <= t;
      var titleField = it[TITLE_KEY[cat]];
      var subField = subDisplay(cat, it);
      var isEditing = !!state.editMode[it.id];
      var body = isEditing ? renderEditForm(cat, it) : renderDetail(cat, it);
      var openClass = (state.openDetail[it.id] || isEditing) ? '' : ' hidden';

      return headHtml + '<div>' +
        '<div class="item-row" data-toggle="'+it.id+'">' +
          '<div class="main"><span class="word">'+esc(titleField||'')+'</span>' +
            (subField ? '<span class="reading">'+esc(subField)+'</span>' : '') +
            '<span class="meaning">'+esc(it.meaning||'')+'</span></div>' +
          '<div class="meta">' + boxDisplay(it) +
            (cat === 'expr' && it.unknownWords && it.unknownWords.length ? '<span class="created-chip">📝 단어 '+it.unknownWords.length+'</span>' : '') +
            (it.topic && sortIsNotTopic(cat) ? '<span class="created-chip">📘 '+esc(it.topic)+'</span>' : '') +
            '<span class="created-chip">등록 '+shortDate(it.created)+'</span>' +
            (isWeak(it) ? '<span class="due-chip" title="자주 까먹은 항목">⚠️ '+it.wrongCount+'</span>' : '') +
            (isDue ? '<span class="due-chip">복습 대기</span>' : '<span>다음 '+shortDate(it.next)+'</span>') +
          '</div>' +
        '</div>' +
        '<div class="item-detail'+openClass+'" id="detail-'+it.id+'">'+body+'</div>' +
      '</div>';
    }).join('');

    var paginationHtml = '';
    if (totalPages > 1){
      paginationHtml = '<div class="pagination-row">' +
        '<button data-page="first" '+(page<=1?'disabled':'')+'>« 맨 앞</button>' +
        '<button data-page="prev" '+(page<=1?'disabled':'')+'>‹ 이전</button>' +
        '<span class="page-indicator">'+page+' / '+totalPages+' 페이지 ('+allItems.length+'개)</span>' +
        '<button data-page="next" '+(page>=totalPages?'disabled':'')+'>다음 ›</button>' +
        '<button data-page="last" '+(page>=totalPages?'disabled':'')+'>맨 끝 »</button>' +
        '</div>';
    }
    return '<div class="item-list">' + rows + '</div>' + paginationHtml;
  }


  function renderDetail(cat, it){
    var rows = backRowsForDetail(cat, it);
    var html = rows.filter(function(r){ return r[1]; }).map(renderDetailRow).join('');
    html += '<div class="detail-actions">' +
      '<button class="ghost" data-edit="'+it.id+'" data-cat="'+cat+'">수정</button>' +
      '<button class="ghost" data-del="'+it.id+'" data-cat="'+cat+'">삭제</button>' +
      '</div>';
    return html;
  }
  function readingDetailRows(it){
    return sortedReadingGroups(it)
      .filter(function(g){ return g.reading || g.words.length; })
      .map(function(g){
        var items = formatKanjiWordItems(g.words);
        return [(g.type === 'on' ? '음독' : '훈독'), items.join('\n'), g.reading || '', items];
      });
  }
  // Only fields NOT already visible in the collapsed row (title, sub-field, meaning,
  // and the created/next-review chips) are repeated here.
  function backRowsForDetail(cat, it){
    var rows;
    if (cat === 'vocab') rows = [['예문',it.example],['비고',it.note],['나만의 문장',it.mySentence]];
    else if (cat === 'kanji') rows = readingDetailRows(it).concat([['비고',it.note]]);
    else if (cat === 'grammar') rows = [['예문',it.example],['비고',it.note],['나만의 문장',it.mySentence]];
    else rows = [['예문',it.example],['비고',it.note],['나만의 문장',it.mySentence]];
    if (cat === 'expr' && it.unknownWords && it.unknownWords.length){
      rows.push(['모르는 단어', it.unknownWords.map(function(w){
        var s = w.word || ''; if (w.reading) s += '['+w.reading+']'; if (w.meaning) s += ' '+w.meaning;
        return s;
      }).join('\n')]);
    }
    return rows;
  }

  function renderEditForm(cat, it){
    var prefix = 'edit-' + it.id;
    var isExpr = cat === 'expr';
    var isKanji = cat === 'kanji';
    var unknownRows = isExpr ? (it.unknownWords || []).map(copyEword) : [];
    var readingGroups = isKanji ? getReadingGroups(it).map(function(g){
      // copyWord로 복사해서, 수정해도 예시 단어의 복습 기록(레벨/다음 복습일)이 유지되게 함
      return { type:g.type||'on', reading:g.reading||'', words:g.words.map(copyWord) };
    }) : [];
    var html = '<form class="entry" id="'+prefix+'-form" style="margin-bottom:0;padding-bottom:6px;border-bottom:none;">' + generateFormFields(cat, prefix, it);
    if (isKanji){
      html += '<div class="full"><label>음독/훈독별 예시 단어</label>' +
        '<div class="word-mini-list" id="'+prefix+'-readings-list"></div>' +
        '<button type="button" class="ghost" id="'+prefix+'-add-reading">+ 읽기 추가</button></div>';
    }
    if (isExpr){
      html += '<div class="full"><label>표현 중 모르는 단어</label>' +
        '<div class="word-mini-list" id="'+prefix+'-unknown-list"></div>' +
        '<button type="button" class="ghost" id="'+prefix+'-add-word">+ 단어 추가</button></div>';
    }
    html += '<div class="actions"><button type="button" class="secondary" id="'+prefix+'-cancel">취소</button><button type="submit" class="primary">저장</button></div></form>';

    setTimeout(function(){
      bindDuplicateCheck(cat, prefix, it.id);
      bindAiCheck(cat, prefix);
      if (isKanji){
        renderReadingGroupsEditor(prefix + '-readings-list', readingGroups);
        var addReadingBtn = document.getElementById(prefix + '-add-reading');
        if (addReadingBtn) addReadingBtn.addEventListener('click', function(){
          // 읽기를 추가하면 단어 입력칸이 기본으로 3개씩 같이 생김
          readingGroups.push({ type:'on', reading:'', words: makeEmptyWords(3) });
          renderReadingGroupsEditor(prefix + '-readings-list', readingGroups);
          var el = document.getElementById(prefix + '-readings-list');
          var inputs = el.querySelectorAll('[data-f="reading"]:not([data-wi])');
          if (inputs.length) inputs[inputs.length - 1].focus();
        });
      }
      if (isExpr){
        renderUnknownWordsEditor(prefix + '-unknown-list', unknownRows);
        var addBtn = document.getElementById(prefix + '-add-word');
        if (addBtn) addBtn.addEventListener('click', function(){
          unknownRows.push({ word:'', reading:'', meaning:'' });
          renderUnknownWordsEditor(prefix + '-unknown-list', unknownRows);
          focusNewRow(prefix + '-unknown-list', 'word');
        });
      }
      var cancelBtn = document.getElementById(prefix + '-cancel');
      if (cancelBtn) cancelBtn.addEventListener('click', function(){ state.editMode[it.id] = false; renderAll(); });
      var form = document.getElementById(prefix + '-form');
      if (form) form.addEventListener('submit', function(e){
        e.preventDefault();
        var fields = readFormFields(cat, prefix);
        if (isExpr) fields.unknownWords = unknownRows.filter(function(w){ return w.word && w.word.trim(); }).map(function(w){ if (!w.id) w.id = uid(); return w; });
        if (isKanji) fields.readings = readingGroups
          .map(function(g){ return { type:g.type, reading:(g.reading||'').trim(), words: g.words.filter(function(w){ return w.word && w.word.trim(); }) }; })
          .filter(function(g){ return g.reading || g.words.length; });
        updateItem(cat, it.id, fields);
        state.editMode[it.id] = false;
      });
    }, 0);

    return html;
  }

  function bindListEvents(cat){
    var panel = document.getElementById('panel-' + cat);
    panel.querySelectorAll('[data-toggle]').forEach(function(row){
      row.addEventListener('click', function(){
        var id = row.getAttribute('data-toggle');
        if (state.editMode[id]) return;
        state.openDetail[id] = !state.openDetail[id];
        var detail = document.getElementById('detail-' + id);
        if (detail) detail.classList.toggle('hidden', !state.openDetail[id]);
      });
    });
    panel.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-del'), c = btn.getAttribute('data-cat');
        if (confirm('이 항목을 삭제할까요?')){ deleteItem(c, id); }
      });
    });
    panel.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-edit');
        state.editMode[id] = true;
        state.openDetail[id] = true;
        renderAll();
      });
    });
    panel.querySelectorAll('[data-page]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var dir = btn.getAttribute('data-page');
        if (dir === 'first') state.page[cat] = 1;
        else if (dir === 'last') state.page[cat] = Math.max(1, Math.ceil(filteredSortedItems(cat).length / PAGE_SIZE));
        else state.page[cat] += (dir === 'next') ? 1 : -1;
        refreshListOnly(cat);
      });
    });
  }

  // ---------- 전체 검색 ----------
  var gsResults = [];
  function globalSearch(term){
    term = term.trim().toLowerCase();
    var out = [];
    if (!term) return out;
    Object.keys(CATS).forEach(function(cat){
      data[cat].forEach(function(it){
        if (searchableText(cat, it).indexOf(term) === -1) return;
        var extra = '';
        if (cat === 'expr'){
          var base = ((it.expr || '') + ' ' + (it.meaning || '')).toLowerCase();
          var hit = (it.unknownWords || []).find(function(w){
            return ((w.word || '') + ' ' + (w.reading || '') + ' ' + (w.meaning || '')).toLowerCase().indexOf(term) !== -1;
          });
          if (hit && base.indexOf(term) === -1) extra = '📝 ' + hit.word + (hit.meaning ? ' · ' + hit.meaning : '');
        }
        out.push({ cat:cat, it:it, extra:extra });
      });
    });
    return out;
  }
  function hideGlobalResults(){
    var box = document.getElementById('global-results');
    if (box){ box.classList.add('hidden'); box.innerHTML = ''; }
    gsResults = [];
  }
  function renderGlobalResults(){
    var input = document.getElementById('global-search');
    var box = document.getElementById('global-results');
    if (!input || !box) return;
    var term = input.value;
    if (!term.trim()){ hideGlobalResults(); return; }
    gsResults = globalSearch(term);
    var shown = gsResults.slice(0, 40);
    var html = shown.map(function(r, i){
      var it = r.it, cat = r.cat;
      var title = String(it[TITLE_KEY[cat]] || '').split('\n')[0];
      var subParts = [subDisplay(cat, it), String(it.meaning || '').split('\n')[0], r.extra, it.topic ? '📘 ' + it.topic : ''].filter(Boolean);
      return '<div class="gs-row" data-gs="'+i+'"><span class="gs-cat '+CATS[cat].color+'">'+esc(CATS[cat].label)+'</span>' +
        '<span class="gs-title">'+esc(title)+'</span><span class="gs-sub">'+esc(subParts.join(' · '))+'</span></div>';
    }).join('');
    if (!html) html = '<div class="gs-empty">검색 결과가 없어요.</div>';
    else if (gsResults.length > shown.length) html += '<div class="gs-empty">'+gsResults.length+'개 중 '+shown.length+'개만 보여요. 검색어를 더 구체적으로 써보세요.</div>';
    box.innerHTML = html;
    box.classList.remove('hidden');
    box.querySelectorAll('[data-gs]').forEach(function(row){
      row.addEventListener('click', function(){
        var r = gsResults[+row.getAttribute('data-gs')];
        if (r) goToItem(r.cat, r.it, term.trim());
      });
    });
  }
  function goToItem(cat, it, term){
    state.activeTab = cat;
    state.search[cat] = term;
    state.page[cat] = 1;
    state.kanaFilter[cat] = null;
    if (isTopicCat(cat)) state.topicFilter[cat] = null;
    state.openDetail[it.id] = true;
    state.editMode[it.id] = false;
    var input = document.getElementById('global-search');
    if (input) input.value = '';
    hideGlobalResults();
    renderAll();
    setTimeout(function(){
      var el = document.getElementById('detail-' + it.id);
      if (el && el.scrollIntoView) el.scrollIntoView({ block:'center' });
    }, 0);
  }

  function renderAll(){
    renderThemeRow();
    renderTabs();
    switchPanel();
    if (state.activeTab === 'review') renderReview();
    else renderCategoryPanel(state.activeTab);
  }

  // ---------- Auth wiring ----------
  function showApp(){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
  function showLogin(){
    closeSettings();
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
  function setLoginError(msg){ document.getElementById('login-error').textContent = msg || ''; }

  document.getElementById('login-btn').addEventListener('click', function(){
    var email = document.getElementById('login-email').value.trim();
    var pw = document.getElementById('login-password').value;
    setLoginError('');
    auth.signInWithEmailAndPassword(email, pw).catch(function(e){ setLoginError(e.message); });
  });
  document.getElementById('signup-btn').addEventListener('click', function(){
    var email = document.getElementById('login-email').value.trim();
    var pw = document.getElementById('login-password').value;
    setLoginError('');
    auth.createUserWithEmailAndPassword(email, pw).catch(function(e){ setLoginError(e.message); });
  });
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  var gsInput = document.getElementById('global-search');
  gsInput.addEventListener('input', renderGlobalResults);
  gsInput.addEventListener('focus', function(){ if (gsInput.value.trim()) renderGlobalResults(); });
  gsInput.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ gsInput.value = ''; hideGlobalResults(); gsInput.blur(); }
  });
  document.addEventListener('click', function(e){
    if (!(e.target.closest && e.target.closest('.global-search'))) hideGlobalResults();
  });
  document.getElementById('settings-close').addEventListener('click', closeSettings);
  document.getElementById('settings-overlay').addEventListener('click', function(e){
    if (e.target === this) closeSettings();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && state.settingsOpen) closeSettings();
  });

  // 단어/한자/문형 등 입력칸에서 (특히 한글·일본어 입력 중 엔터로 조합을
  // 확정할 때) 실수로 폼이 그대로 제출되지 않도록 막음. 대신 Ctrl(⌘)+Enter로
  // 어느 칸에서든 바로 저장할 수 있음 — 터치 없이 키보드만으로 입력 가능.
  document.addEventListener('keydown', function(e){
    var form = e.target && e.target.closest && e.target.closest('form.entry');
    if (!form) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      return;
    }
    if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' &&
        (e.target.type === 'text' || !e.target.type)){
      e.preventDefault();
      var focusables = Array.prototype.slice.call(form.querySelectorAll('input, textarea, select, button'))
        .filter(function(el){ return !el.disabled && el.offsetParent !== null && el.getAttribute('tabindex') !== '-1'; });
      var idx = focusables.indexOf(e.target);
      if (idx > -1 && idx < focusables.length - 1) focusables[idx + 1].focus();
    }
  });

  // 복습 중 키보드 단축키: 스페이스바 = 답 보기, ← = 까먹었어요, → = 기억나요.
  document.addEventListener('keydown', function(e){
    if (state.settingsOpen) return;
    if (state.activeTab !== 'review' || !state.reviewQueue) return;
    if (state.reviewIdx >= state.reviewQueue.length) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.code === 'KeyZ' || e.key === 'Backspace'){
      e.preventDefault();
      undoLastReview();
      return;
    }
    if (e.code === 'Space' || e.key === ' '){
      if (!state.reviewFlipped){
        e.preventDefault();
        state.reviewFlipped = true;
        renderReview();
      }
      return;
    }
    if (state.reviewFlipped && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      e.preventDefault();
      var cur = state.reviewQueue[state.reviewIdx];
      applyReview(cur, e.key === 'ArrowRight');
      state.reviewIdx += 1;
      state.reviewFlipped = false;
      renderReview();
    }
  });

  auth.onAuthStateChanged(function(user){
    detachFirestore();
    if (user){
      document.documentElement.setAttribute('data-theme', initialTheme());
      state.theme = document.documentElement.getAttribute('data-theme');
      state.activeTab = 'review'; state.reviewQueue = null; state.reviewIdx = 0; state.reviewFlipped = false;
      state.openDetail = {}; state.editMode = {};
      showApp();
      renderAll();
      attachFirestore(user.uid);
    } else {
      showLogin();
    }
  });
})();
</script>
</body>
</html>
