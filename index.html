      if (add){
        var set = add.closest('.expr-set');
        var list = set && set.querySelector('.ew-list');

    });
    form.addEventListener('submit', function(e){ e.preventDefault(); submitExprForm(); });
  }
  function submitExprForm(){
    var topic = (document.getElementById('add-expr-topic').value || '').trim();
    var today = todayStr();
    var existing = {}, maxSeq = 0;
    data.expr.forEach(function(it){
      existing[(it.topic || '') + '|' + (it.expr || '').trim()] = true;
      if ((it.topic || '') === topic && (it.seq || 0) > maxSeq) maxSeq = it.seq;
    });
    var exprItems = [], skipE = 0, wordCount = 0, skipW = 0, pendingEntries = [], lexNow = ewAllLex();
    document.querySelectorAll('#add-expr-rows .expr-set').forEach(function(r){
      var pf = 'add-expr-r' + r.getAttribute('data-row');
      function v(k){ var el = document.getElementById(pf + '-' + k); return el ? el.value.trim() : ''; }
      var e = v('expr');
      if (!e) return;
      var key = topic + '|' + e;
      if (existing[key]){ skipE++; return; }
      existing[key] = true;
      var words = [];
      r.querySelectorAll('.uw-row').forEach(function(wr){
        function wv(k){ var el = wr.querySelector('[data-f="' + k + '"]'); return el ? el.value.trim() : ''; }
        var w = wv('word');
        if (!w) return;
        var wo = { id:uid(), word:w, reading:wv('reading'), meaning:wv('meaning') };
        // 이미 적어둔 단어(이 표현에 자동 연결되는)면 또 저장하지 않음
        if (ewCovered(ewNorm(e), wo, lexNow.concat(pendingEntries))){ skipW++; return; }
        words.push(wo);
      });
      var item = { id:uid(), created:today, box:0, next:today, expr:e, meaning:v('meaning'), example:v('example'),
        note:'', mySentence:v('mySentence'), topic:topic, seq:++maxSeq };
      if (words.length){ item.unknownWords = words; wordCount += words.length; }
      words.forEach(function(w){ pendingEntries.push(ewMakeEntry(w, item)); });
      exprItems.push(item);
    });
    if (!exprItems.length){
      alert(skipE ? '이미 등록된 표현이라 새로 저장할 게 없어요.' : '저장할 표현을 먼저 입력해 주세요.');
      return;
    }
    exprItems.forEach(function(it){ data.expr.push(it); });
    pushCategory('expr');
    state.exprSaveMsg = '✅ 표현 ' + exprItems.length + '개' + (wordCount ? ' (모르는 단어 ' + wordCount + '개 포함)' : '') + ' 저장했어요.' + (skipE ? ' (이미 있는 표현 ' + skipE + '개는 건너뜀)' : '') + (skipW ? ' (이미 있는 단어 ' + skipW + '개는 건너뜀)' : '');
    state.topicFilter.expr = topic ? topic : null;
    state.sortMode.expr = 'topic';
    state.page.expr = 1;
    state.pendingFocusCat = 'expr';
    renderAll();
  }
    // 주제 이름 일괄 수정 (같은 이름이 이미 있으면 합치기)
  function renameTopic(cat, oldName){
    var nn = prompt('새 주제 이름', oldName);
    if (nn === null) return;
    nn = nn.trim();
    if (!nn || nn === oldName) return;
    var exists = data[cat].some(function(it){ return (it.topic || '') === nn; });
    if (exists && !confirm('"' + nn + '" 주제가 이미 있어요. 두 주제를 합칠까요?')) return;
    data[cat].forEach(function(it){ if ((it.topic || '') === oldName) it.topic = nn; });
    if (state.lastTopic[cat] === oldName) state.lastTopic[cat] = nn;
    state.topicFilter[cat] = nn;
    pushCategory(cat);
    renderAll();
  }
  function renderTopicRow(cat){
    cat = cat || 'expr';
    var wrap = document.getElementById(cat + '-topic-row');
    if (!wrap) return;
    var tf = state.topicFilter;
    var topics = [], seen = {}, hasNone = false;
    data[cat].forEach(function(it){
      var t = it.topic || '';
      if (!t){ hasNone = true; return; }
      if (!seen[t]){ seen[t] = true; topics.push(t); }
    });
    if (tf[cat] !== null && tf[cat] !== '' && !seen[tf[cat]]) tf[cat] = null;
    if (tf[cat] === '' && !hasNone) tf[cat] = null;
    if (!topics.length && !hasNone){ wrap.innerHTML = ''; return; }
    var selVal = tf[cat] === null ? '__all__' : (tf[cat] === '' ? '__none__' : tf[cat]);
    var opts = ['<option value="__all__">전체 주제 ('+topics.length+'개)</option>'];
    topics.forEach(function(t){ opts.push('<option value="'+esc(t)+'">'+esc(t)+'</option>'); });
    if (hasNone) opts.push('<option value="__none__">주제 없음</option>');
    wrap.innerHTML = '<select class="topic-select" aria-label="주제 선택">'+opts.join('')+'</select>';
    var sel = wrap.querySelector('select');
    sel.value = selVal;
    sel.addEventListener('change', function(){
      var v = sel.value;
      tf[cat] = v === '__all__' ? null : (v === '__none__' ? '' : v);
      state.page[cat] = 1;
      refreshListOnly(cat);
    });
        if (tf[cat]){
      var ren = document.createElement('button');
      ren.type = 'button';
      ren.className = 'secondary';
      ren.textContent = '✏️ 주제 이름 수정';
      ren.addEventListener('click', function(){ renameTopic(cat, tf[cat]); });

    }
  }

    if (isKanji){

      document.getElementById(prefix + '-add-reading').addEventListener('click', function(){

        e.preventDefault();

          .map(function(g){ return { type:g.type, reading:(g.type === 'ex' ? '' : (g.reading||'').trim()), words: g.words.filter(function(w){ return w.word && w.word.trim(); }) }; })
          .filter(function(g){ return g.type === 'ex' || g.reading || g.words.length; });
        if (cat === 'grammar'){
          var ms = 0;
          data.grammar.forEach(function(g){ if ((g.topic || '') === (fields.topic || '') && (g.seq || 0) > ms) ms = g.seq; });
          fields.seq = ms + 1;
          state.lastTopic.grammar = fields.topic || '';   // 같은 주제로 이어서 쓸 수 있게 기억
        }

        addItem(cat, fields);
      });
    }

    if (state.pendingFocusCat === cat){
      state.pendingFocusCat = null;
      focusAddForm(cat);   // 연속 입력: 저장하면 폼은 열린 채로 첫 칸에 커서가 돌아감
    }
  }
  function focusAddForm(cat){
    var el = cat === 'expr' ? document.getElementById('add-expr-topic') : document.getElementById('add-' + cat + '-' + TITLE_KEY[cat]);
    if (el) el.focus();
  }
  function updateFilterBtn(cat){
    var b = document.getElementById(cat + '-filter-toggle');
    if (!b) return;
    var n = 0;
    if (isTopicCat(cat) && state.topicFilter[cat] !== null && state.topicFilter[cat] !== undefined) n++;
    if (state.kanaFilter[cat]) n++;

  function renderSortRow(cat){
    var wrap = document.getElementById(cat + '-sort-row');
    if (!wrap) return;
    wrap.innerHTML =
      (isTopicCat(cat) ? '<button data-sort="topic" class="'+(state.sortMode[cat]==='topic'?'active':'')+'">주제순</button>' : '') +
      '<button data-sort="due" class="'+(state.sortMode[cat]==='due'?'active':'')+'">복습순</button>' +
      '<button data-sort="created" class="'+(state.sortMode[cat]==='created'?'active':'')+'" title="한 번 더 누르면 오름/내림이 바뀌어요">등록순 ' + (state.createdDir[cat] === 'desc' ? '↓ 최근 먼저' : '↑ 오래된 먼저') + '</button>' +
      '<button data-sort="kana" class="'+(state.sortMode[cat]==='kana'?'active':'')+'">발음순 (あいうえお)</button>';
    wrap.querySelectorAll('[data-sort]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var mode = btn.getAttribute('data-sort');
        if (mode === 'created' && state.sortMode[cat] === 'created') state.createdDir[cat] = state.createdDir[cat] === 'desc' ? 'asc' : 'desc';
        state.sortMode[cat] = mode;
        state.page[cat] = 1;
        renderSortRow(cat);
        refreshListOnly(cat);
      });
    });
  }
  function renderKanaRow(cat){
    var wrap = document.getElementById(cat + '-kana-row');
    if (!wrap) return;
    var keys = KANA_ROWS.map(function(r){ return r.key; }).concat(['기타']);
    wrap.innerHTML = keys.map(function(k){
      return '<button class="kana-chip'+(state.kanaFilter[cat]===k?' active':'')+'" data-kana="'+esc(k)+'">'+esc(k)+'</button>';
    }).join('');
    wrap.querySelectorAll('[data-kana]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-kana');
        state.kanaFilter[cat] = (state.kanaFilter[cat] === k) ? null : k;
        state.page[cat] = 1;
        renderKanaRow(cat);
        refreshListOnly(cat);
      });
    });
  }
  function sortIsNotTopic(cat){ return !(isTopicCat(cat) && state.sortMode[cat] === 'topic'); }
  function refreshListOnly(cat){
    var container = document.getElementById(cat + '-list-container');
    if (!container) return;
    if (isTopicCat(cat)) renderTopicRow(cat);
    container.innerHTML = renderListMarkup(cat);
    bindListEvents(cat);
    updateFilterBtn(cat);
  }

  function boxDisplay(it){ return '<span class="box-chip">Lv.'+ (it.box+1) +'</span>'; }

  var KANA_ROWS = [
    { key:'あ', chars:'あいうえおぁぃぅぇぉ' },
    { key:'か', chars:'かきくけこがぎぐげご' },
    { key:'さ', chars:'さしすせそざじずぜぞ' },
    { key:'た', chars:'たちつてとだぢづでどっ' },
    { key:'な', chars:'なにぬねの' },
    { key:'は', chars:'はひふへほばびぶべぼぱぴぷぺぽ' },
    { key:'ま', chars:'まみむめも' },
    { key:'や', chars:'やゆよゃゅょ' },
    { key:'ら', chars:'らりるれろ' },
    { key:'わ', chars:'わをん' }
  ];
  function toHiragana(ch){
    var code = ch.codePointAt(0);
    if (code >= 0x30A1 && code <= 0x30FA) return String.fromCharCode(code - 0x60);
    return ch;
  }
  function kanaRowOf(str){
    if (!str) return null;
    var ch = toHiragana(str.trim().charAt(0));
    for (var i = 0; i < KANA_ROWS.length; i++){
      if (KANA_ROWS[i].chars.indexOf(ch) !== -1) return KANA_ROWS[i].key;
    }
    return null; // 한자·로마자 등 가나로 시작하지 않는 항목 -> "기타"
  }
  function readingKeyOf(cat, it){
    if (cat === 'vocab') return it.reading || it.word || '';
    if (cat === 'kanji'){
      var groups = getReadingGroups(it);
      return (groups[0] && groups[0].reading) || it.kanji || '';
    }
    if (cat === 'grammar') return it.pattern || '';
    return it.expr || '';
  }
  function searchableText(cat, it){
    // 예문 / 나만의 문장은 검색 대상에서 제외 (문장 속 단어까지 다 걸려서 지저분해지는 것 방지)
    var parts = [it[TITLE_KEY[cat]], it.meaning, it.note, it.topic];
    if (cat === 'vocab') parts.push(it.reading);
    if (cat === 'kanji') getReadingGroups(it).forEach(function(g){
      parts.push(g.reading);
      g.words.forEach(function(w){ parts.push(w.word, w.reading, w.meaning); });
    });
    if (cat === 'grammar') parts.push(it.conjugation);
    if (cat === 'expr' && it.unknownWords) it.unknownWords.forEach(function(w){ parts.push(w.word, w.reading, w.meaning); });
    return parts.filter(Boolean).join(' ').toLowerCase();
  }
  function filteredSortedItems(cat){
    var items = data[cat].slice();
    var term = (state.search[cat] || '').trim().toLowerCase();
    if (term) items = items.filter(function(it){ return searchableText(cat, it).indexOf(term) !== -1; });
    if (isTopicCat(cat) && state.topicFilter[cat] !== null){
      items = items.filter(function(it){ return (it.topic || '') === state.topicFilter[cat]; });
    }
    var kf = state.kanaFilter[cat];
    if (kf) items = items.filter(function(it){ return kanaRowOf(readingKeyOf(cat, it)) === (kf === '기타' ? null : kf); });
    if (isTopicCat(cat) && state.sortMode[cat] === 'topic'){
      var rank = {}, rn = 0;
      data[cat].forEach(function(it){ var k = it.topic || ''; if (rank[k] === undefined) rank[k] = rn++; });
      items.sort(function(a,b){
        var ra = rank[a.topic || ''], rb = rank[b.topic || ''];
        if (ra !== rb) return ra - rb;
        if ((a.seq || 0) !== (b.seq || 0)) return (a.seq || 0) - (b.seq || 0);
        if (a.created !== b.created) return a.created < b.created ? -1 : 1;
        return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
      });
    } else if (state.sortMode[cat] === 'kana'){
      items.sort(function(a,b){ return readingKeyOf(cat,a).localeCompare(readingKeyOf(cat,b), 'ja'); });
    } else if (state.sortMode[cat] === 'created'){
      var dirSign = state.createdDir[cat] === 'asc' ? 1 : -1;
      items.sort(function(a,b){
        var c = 0;
        if (a.created !== b.created) c = a.created < b.created ? -1 : 1;
        else if ((a.seq || 0) !== (b.seq || 0)) c = (a.seq || 0) - (b.seq || 0);
        else c = a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
        return c * dirSign;
      });
    } else {
      items.sort(function(a,b){ return a.next < b.next ? -1 : 1; });
    }
    return items;
  }
  function subDisplay(cat, it){
    if (cat === 'kanji'){
      var groups = getReadingGroups(it);
      var onList = groups.filter(function(g){ return g.type === 'on'; }).map(function(g){ return g.reading; }).filter(Boolean);
      var kunList = groups.filter(function(g){ return g.type === 'kun'; }).map(function(g){ return g.reading; }).filter(Boolean);
      var parts = [];
      if (onList.length) parts.push('음: ' + onList.join('・'));
      if (kunList.length) parts.push('훈: ' + kunList.join('・'));
      if (groups.some(function(g){ return g.type === 'ex'; })) parts.push('예외');
      return parts.join('  ');
    }
    // 문법의 접속 형태는 목록에 나오지 않고, 항목을 눌러 펼쳤을 때만 보임
    if (cat === 'grammar') return '';
    return SUB_KEY[cat] ? it[SUB_KEY[cat]] : '';
  }

  // 한자 목록용: 음독/훈독을 색깔 라벨 + 줄바꿈으로 구분해서 보여줌
  function kanjiReadsHtml(it){
    var groups = getReadingGroups(it);
    function line(type, label){
      var list = groups.filter(function(g){ return g.type === type; }).map(function(g){ return g.reading; }).filter(Boolean);
      if (!list.length) return '';
      return '<div class="kr-line"><span class="kr-badge kr-'+type+'">'+label+'</span><span class="kr-text">'+esc(list.join('・'))+'</span></div>';
    }
    var html = line('on', '음독') + line('kun', '훈독');
    // 예외는 단어마다 읽기가 달라서 대표 읽기가 없음 → 목록에는 '예외 있음' 표시만
    if (groups.some(function(g){ return g.type === 'ex'; })) html += '<div class="kr-line"><span class="kr-badge kr-ex">예외</span></div>';
    return html ? '<div class="kanji-reads">'+html+'</div>' : '';
  }

  function renderListMarkup(cat){
    var allItems = filteredSortedItems(cat);
    if (!allItems.length){
      var hasAny = data[cat].length > 0;
      return '<div class="empty-note">'+(hasAny ? '조건에 맞는 항목이 없어요.' : '아직 추가된 '+CATS[cat].label+' 항목이 없어요.')+'</div>';
    }
    var totalPages = Math.max(1, Math.ceil(allItems.length / PAGE_SIZE));
    if (state.page[cat] > totalPages) state.page[cat] = totalPages;
    if (state.page[cat] < 1) state.page[cat] = 1;
    var page = state.page[cat];
    var items = allItems.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    var t = todayStr();
    var prevTopic = null;
    var topicCounts = {};
    allItems.forEach(function(x){ var k = x.topic || ''; topicCounts[k] = (topicCounts[k] || 0) + 1; });
    var rows = items.map(function(it){
      var headHtml = '';
      if (isTopicCat(cat) && state.sortMode[cat] === 'topic'){
        var tk = it.topic || '';
        if (tk !== prevTopic){
          headHtml = '<div class="topic-head">' + (cat === 'grammar' ? '📗 ' : '📘 ') + esc(tk || '주제 없음') + '<span>' + topicCounts[tk] + '개</span></div>';
          prevTopic = tk;
        }
      }
      var isDue = it.next <= t;
      var titleField = it[TITLE_KEY[cat]];
      var subField = subDisplay(cat, it);
      var isEditing = !!state.editMode[it.id];
      var body = isEditing ? renderEditForm(cat, it) : renderDetail(cat, it);
      var openClass = (state.openDetail[it.id] || isEditing) ? '' : ' hidden';

      return headHtml + '<div>' +
        '<div class="item-row" data-toggle="'+it.id+'">' +
          '<div class="main"><span class="word">'+speakLinesHtml(titleField)+'</span>' +
            (cat === 'kanji' ? kanjiReadsHtml(it) : (subField ? '<span class="reading">'+esc(subField)+'</span>' : '')) +
            '<span class="meaning">'+esc(it.meaning||'')+'</span></div>' +
          '<div class="meta">' + boxDisplay(it) +
            (cat === 'expr' ? exprWordChips(it) : '') +
            (it.topic && sortIsNotTopic(cat) ? '<span class="created-chip">📘 '+esc(it.topic)+'</span>' : '') +
            '<span class="created-chip">등록 '+shortDate(it.created)+'</span>' +
            (isWeak(it) ? '<span class="due-chip" title="자주 까먹은 항목">⚠️ '+it.wrongCount+'</span>' : '') +
            (isDue ? '' : '<span>다음 '+shortDate(it.next)+'</span>') +
          '</div>' +
        '</div>' +
        '<div class="item-detail'+openClass+'" id="detail-'+it.id+'">'+body+'</div>' +
      '</div>';
    }).join('');

    var paginationHtml = '';
    if (totalPages > 1){
      paginationHtml = '<div class="pagination-row">' +
        '<button data-page="first" '+(page<=1?'disabled':'')+'>« 맨 앞</button>' +
        '<button data-page="prev" '+(page<=1?'disabled':'')+'>‹ 이전</button>' +
        '<span class="page-indicator">'+page+' / '+totalPages+' 페이지 ('+allItems.length+'개)</span>' +
        '<button data-page="next" '+(page>=totalPages?'disabled':'')+'>다음 ›</button>' +
        '<button data-page="last" '+(page>=totalPages?'disabled':'')+'>맨 끝 »</button>' +
        '</div>';
    }
    return '<div class="item-list">' + rows + '</div>' + paginationHtml;
  }


  function renderDetail(cat, it){
    var rows = backRowsForDetail(cat, it);
    var html = rows.filter(function(r){ return r[1]; }).map(renderDetailRow).join('');
    html += '<div class="detail-actions">' +
      '<button class="ghost" data-edit="'+it.id+'" data-cat="'+cat+'">수정</button>' +
      '<button class="ghost" data-del="'+it.id+'" data-cat="'+cat+'">삭제</button>' +
      '</div>';
    return html;
  }
  function readingDetailRows(it){
    return sortedReadingGroups(it)
      .filter(function(g){ return g.reading || g.words.length; })
      .map(function(g){
        var items = formatKanjiWordItems(g.words);
        var speaks = g.words.filter(function(w){ return (w.word || '') || (w.reading || '') || (w.meaning || ''); })
          .map(function(w){ return w.reading || w.word || ''; });
        return [(g.type === 'on' ? '음독' : (g.type === 'ex' ? '예외' : '훈독')), items.join('\n'), g.reading || '', items, speaks];
      });
  }
  // Only fields NOT already visible in the collapsed row (title, sub-field, meaning,
  // and the created/next-review chips) are repeated here.
  function backRowsForDetail(cat, it){
    var rows;

    else if (cat === 'kanji') rows = readingDetailRows(it).concat([['비고',it.note]]);
    else if (cat === 'grammar') rows = [['접속 형태',it.conjugation],['예문',it.example],['비고',it.note],['나만의 문장',it.mySentence]];
    else rows = [['예문',it.example],['비고',it.note],['나만의 문장',it.mySentence]];

  // 소리 낼 때는 일본어가 있는 줄만 읽음 (예문 밑에 적어둔 한국어 해석은 빼고)
  function jpOnly(text){
    return String(text || '').split('\n').map(function(line){
      if (!/[\u3040-\u30ff\u4e00-\u9fff]/.test(line)) return '';
      return line.replace(/[\uac00-\ud7af]+/g, ' ').replace(/\s+/g, ' ').trim();
    }).filter(Boolean).join('\n');
  }

    panel.querySelectorAll('[data-del]').forEach(function(btn){

        if (dir === 'first') state.page[cat] = 1;
        else if (dir === 'last') state.page[cat] = Math.max(1, Math.ceil(filteredSortedItems(cat).length / PAGE_SIZE));
        else state.page[cat] += (dir === 'next') ? 1 : -1;

  // ---------- 전체 검색 ----------
  var gsResults = [];
  function globalSearch(term){
    term = term.trim().toLowerCase();
    var out = [];
    if (!term) return out;
    Object.keys(CATS).forEach(function(cat){
      data[cat].forEach(function(it){
        if (searchableText(cat, it).indexOf(term) === -1) return;
        out.push({ cat:cat, it:it });
      });
    });
    return out;
  }
  function hideGlobalResults(){
    var box = document.getElementById('global-results');
    if (box){ box.classList.add('hidden'); box.innerHTML = ''; }
    gsResults = [];
  }
  // 검색어를 형광펜(<mark>)으로 표시 — HTML 이스케이프 포함
  function hl(text, tl){
    text = (text == null) ? '' : String(text);
    if (!tl) return esc(text);
    var low = text.toLowerCase();
    if (low.length !== text.length) return esc(text);
    var out = '', pos = 0, k;
    while ((k = low.indexOf(tl, pos)) !== -1){
      out += esc(text.slice(pos, k)) + '<mark class="gs-hl">' + esc(text.slice(k, k + tl.length)) + '</mark>';
      pos = k + tl.length;
    }
    return out + esc(text.slice(pos));
  }
  // 긴 글은 검색어 주변만 잘라서 보여줌
  function gsSnippet(text, tl){
    text = String(text || '').replace(/\s+/g, ' ').trim();
    if (text.length <= 60) return text;
    var k = text.toLowerCase().indexOf(tl);
    if (k < 0) return text.slice(0, 60) + '…';
    var a = Math.max(0, k - 20), b = Math.min(text.length, k + tl.length + 30);
    return (a > 0 ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
  }
  // 제목/뜻/읽기/주제처럼 행에 원래 보이는 필드 말고, 숨은 곳(메모·예시단어 등)에서 걸린 경우를 알려줌
  function gsMatches(cat, it, tl){
    var out = [];
    function has(v){ return v && String(v).toLowerCase().indexOf(tl) !== -1; }
    function wordText(w){
      return (w.word || '') + (w.reading ? '(' + w.reading + ')' : '') + (w.meaning ? ' ' + String(w.meaning).replace(/\s+/g, ' ') : '');
    }
    function pushWords(label, words){
      var hits = words.filter(function(w){ return has(w.word) || has(w.reading) || has(w.meaning); });
      if (!hits.length) return;
      var txt = hits.slice(0, 4).map(wordText).join(' · ');
      if (hits.length > 4) txt += ' 외 ' + (hits.length - 4) + '개';
      out.push({ label: label, text: txt });
    }
    if (has(it.note)) out.push({ label: '메모', text: gsSnippet(it.note, tl) });
    if (cat === 'grammar' && has(it.conjugation)) out.push({ label: '접속', text: gsSnippet(it.conjugation, tl) });
    if (cat === 'kanji'){
      var all = [];
      getReadingGroups(it).forEach(function(g){ (g.words || []).forEach(function(w){ all.push(w); }); });
      pushWords('예시단어', all);
    }
    if (cat === 'expr' && it.unknownWords) pushWords('모르는 단어', it.unknownWords);
    return out;
  }
  function gsRowHtml(r, attr, tl){
    var it = r.it, cat = r.cat;
    // 여러 줄 항목(예: 来る / する)은 검색어에 걸린 줄을 앞으로 보내고 전부 이어서 보여줌
    function joinLines(text){
      var lines = String(text || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      var hit = lines.filter(function(s){ return s.toLowerCase().indexOf(tl) !== -1; });
      var rest = lines.filter(function(s){ return s.toLowerCase().indexOf(tl) === -1; });
      return hit.concat(rest).join(' / ');
    }
    var title = joinLines(it[TITLE_KEY[cat]]);
    var subParts = [subDisplay(cat, it), joinLines(it.meaning), it.topic ? '📘 ' + it.topic : ''].filter(Boolean);
    var hits = gsMatches(cat, it, tl);
    var hitHtml = hits.length ? '<div class="gs-hit">↳ ' + hits.map(function(h){
      return '<span class="gs-hit-item"><b>' + esc(h.label) + '</b>' + hl(h.text, tl) + '</span>';
    }).join('') + '</div>' : '';
    return '<div class="gs-row" ' + attr + '><span class="gs-cat ' + CATS[cat].color + '">' + esc(CATS[cat].label) + '</span>' +
      '<span class="gs-title">' + hl(title, tl) + '</span><span class="gs-sub">' + hl(subParts.join(' · '), tl) + '</span>' + hitHtml + '</div>';
  }
  function renderGlobalResults(){
    var input = document.getElementById('global-search');
    var box = document.getElementById('global-results');
    if (!input || !box) return;
    var term = input.value;
    if (!term.trim()){ hideGlobalResults(); return; }
    var tl = term.trim().toLowerCase();
    gsResults = globalSearch(term);
    var shown = gsResults.slice(0, 40);
    var html = shown.map(function(r, i){ return gsRowHtml(r, 'data-gs="' + i + '"', tl); }).join('');
    if (!html) html = '<div class="gs-empty">검색 결과가 없어요.</div>';
    else html += '<div class="gs-more" id="gs-open-full">🔎 전체 검색 결과 보기 (' + gsResults.length + '개' +
      (gsResults.length > shown.length ? ' 중 ' + shown.length + '개만 표시 중' : '') + ')</div>';
    box.innerHTML = html;
    box.classList.remove('hidden');
    box.querySelectorAll('[data-gs]').forEach(function(row){
      row.addEventListener('click', function(){
        var r = gsResults[+row.getAttribute('data-gs')];
        if (r) goToItem(r.cat, r.it, term.trim());
      });
    });
    var more = document.getElementById('gs-open-full');
    if (more) more.addEventListener('click', function(){ openFullResults(term.trim()); });
  }

  // ---------- 전체 검색 결과 화면 (탭별) ----------
  var GSF_PAGE = 100;
  var GSF_TABS = ['all', 'vocab', 'kanji', 'grammar', 'expr'];
  var gsf = { term: '', tab: 'all', limit: GSF_PAGE, list: [] };
  function openFullResults(term){
    gsf.term = term; gsf.tab = 'all'; gsf.limit = GSF_PAGE;
    hideGlobalResults();
    var gi = document.getElementById('global-search');
    if (gi) gi.blur();
    document.getElementById('gsf-input').value = term;
    document.getElementById('gs-full-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    renderFullResults();
    document.getElementById('gs-full-overlay').scrollTop = 0;
  }
  function closeFullResults(){
    document.getElementById('gs-full-overlay').classList.add('hidden');
    document.body.style.overflow = '';
  }
  function renderFullResults(){
    var tabsEl = document.getElementById('gsf-tabs');
    var listEl = document.getElementById('gsf-list');
    var term = gsf.term;
    var tl = term.trim().toLowerCase();
    var results = tl ? globalSearch(term) : [];
    var counts = { all: results.length, vocab: 0, kanji: 0, grammar: 0, expr: 0 };
    results.forEach(function(r){ counts[r.cat]++; });
    tabsEl.innerHTML = GSF_TABS.map(function(t){
      var label = t === 'all' ? '전체' : CATS[t].label;
      return '<button type="button" class="gsf-tab' + (gsf.tab === t ? ' active' : '') + (counts[t] ? '' : ' zero') + '" data-tab="' + t + '">' +
        esc(label) + '<span class="n">' + counts[t] + '</span></button>';
    }).join('');
    gsf.list = (gsf.tab === 'all') ? results : results.filter(function(r){ return r.cat === gsf.tab; });
    var shown = gsf.list.slice(0, gsf.limit);
    var html = shown.map(function(r, i){ return gsRowHtml(r, 'data-gsf="' + i + '"', tl); }).join('');
    if (!tl) html = '<div class="gs-empty">검색어를 입력해 주세요.</div>';
    else if (!html) html = '<div class="gs-empty">검색 결과가 없어요.</div>';
    listEl.innerHTML = html;
    if (gsf.list.length > shown.length){
      listEl.insertAdjacentHTML('beforeend', '<button type="button" class="gsf-more-btn" id="gsf-more">더 보기 (' + shown.length + ' / ' + gsf.list.length + ')</button>');
    }
  }

  function goToItem(cat, it, term){
    state.activeTab = cat;
    state.search[cat] = term;
    state.page[cat] = 1;
    state.kanaFilter[cat] = null;
    if (isTopicCat(cat)) state.topicFilter[cat] = null;

    state.editMode[it.id] = false;

    renderAll();

      var el = document.getElementById('detail-' + it.id);
      if (el && el.scrollIntoView) el.scrollIntoView({ block:'center' });
    }, 0);
  }

      warn:{ on:true, head:'', map:'', items:[
        { text:'ㄱㅎ의 경우, が행으로 읽히는 한자들도 일정 수 이상 있음',
          map:'# ㄱ\n구 → {b|ぐ}{g|(具)}\n군 → {b|ぐん}{g|(軍・郡・群)}\n개 → {b|がい}{g|(概・慨)}\n등\n# ㅎ\n해 → {b|がい}{g|(害・該・骸)}\n현 → {b|げん}{g|(現・玄)}\n환 → {b|げん}{g|(幻)}\n후 → {b|ご}{g|(後)}\n호 → {b|ごう}{g|(号・豪)}\n등', chips:'' },
        { text:'ㅎ의 경우, 다음 7자에서는 모음(あ행 및 わ)으로 읽는 경우가 존재하니 주의.', map:'',
          chips:'和 | 화 | わ\n賄 | 회 | わい\n惑 | 혹 | わく\n恵 | 혜 | え\n会 | 회 | かい・え\n横 | 횡 | おう\n黄 | 황 | おう' },
        { text:'ㅋ는 {b|快(쾌)[かい]} 한 글자뿐이니 어휘적으로 외워두기.', map:'', chips:'' }
      ] } },
    { t:'card', law:'초성 대응 ③', head:'초성 {r|ㅅ ㅈ ㅊ}은 기본적으로 {h|さ행}이 된다.', ex:'', warn:{ on:false, head:'', map:'', items:[] } }
  ];
  var TIP_TYPES = { sec:'큰 제목', sub:'소제목', item:'번호 항목', card:'법칙 카드' };
  var TIP_ARROW = /\s*(?:→|->|▶|▷)\s*/;
  state.tipEdit = false; state.tipDraft = null; state.tipBlocks = null;
  var tipLastField = null;

  function tipClone(o){ return JSON.parse(JSON.stringify(o)); }
  function tipBlocks(){ return Array.isArray(state.tipBlocks) ? state.tipBlocks : TIP_DEFAULT; }
  function tipNew(type){
    if (type === 'item') return { t:'item', text:'', subs:'', sum:'', ex:'' };
    if (type === 'card') return { t:'card', law:'', head:'', ex:'', warn:{ on:false, head:'', map:'', items:[] } };
    return { t:type, text:'' };
  }
  function tipMarkup(s){
    return esc(s).replace(/\{([rhbg])\|([^}]*)\}/g, function(_, k, t){
      return '<span class="tip-' + k + '">' + t + '</span>';
    });
  }
  function tipLines(s){ return String(s == null ? '' : s).split('\n').map(function(l){ return l.trim(); }).filter(Boolean); }

  function tipBuild(blocks){
    var X = tipMarkup;
    function ol(items, red){ return '<ol class="tip-ol' + (red ? ' red' : '') + '">' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ol>'; }
    function ul(items){ return '<ul class="tip-ul">' + items.map(function(i){ return '<li>' + X(i) + '</li>'; }).join('') + '</ul>'; }
    function sum(text){ return '<div class="tip-sum"><span class="tip-sum-tag">즉</span><span>' + X(text) + '</span></div>'; }
    function exHtml(s){
      var ls = tipLines(s);
      if (!ls.length) return '';
      return '<div class="tip-ex"><span class="tip-tag">예</span>' + ls.map(function(l){
        var p = l.split(TIP_ARROW);
        return '<span class="tip-pair"><span class="kr">' + X(p[0]) + '</span>' +
          p.slice(1).map(function(x){ return '<i class="arr">→</i><span class="jp">' + X(x) + '</span>'; }).join('') + '</span>';
      }).join('') + '</div>';
    }
    function mapRows(rows, etc){
      return '<div class="tip-map">' + rows.map(function(r){
        return '<div class="tip-m"><b>' + X(r[0]) + '</b><i>→</i><span class="jp">' + X(r[1]) + '</span></div>';
      }).join('') + (etc ? '<div class="tip-etc">등</div>' : '') + '</div>';
    }
    // 대응표: 줄마다 "구 → ぐ(具)" / "# ㄱ" = 묶음 이름 / "등" = 말줄임
    function mapHtml(s){
      var groups = [], cur = null;
      function g(label){ cur = { label:label, rows:[], etc:false }; groups.push(cur); }
      tipLines(s).forEach(function(l){
        if (l.charAt(0) === '#'){ g(l.slice(1).trim()); return; }
        if (!cur) g('');
        if (l === '등'){ cur.etc = true; return; }
        var p = l.split(TIP_ARROW);
        cur.rows.push([p[0], p.slice(1).join(' → ')]);
      });
      return groups.map(function(gr){
        var m = mapRows(gr.rows, gr.etc);
        return gr.label ? '<div class="tip-group"><span class="tip-gl">' + X(gr.label) + '</span>' + m + '</div>' : m;
      }).join('');
    }
    function chipsHtml(s){
      var ls = tipLines(s);
      if (!ls.length) return '';
      return '<div class="tip-chips">' + ls.map(function(l){
        var p = l.split('|').map(function(x){ return x.trim(); });
        return '<span class="tip-chip"><span class="kb">' + esc(p[0] || '') + '</span><span class="tip-g">' + esc(p[1] || '') + '</span><i>→</i><b>' + esc(p[2] || '') + '</b></span>';
      }).join('') + '</div>';
    }
    function warnHtml(w){
      if (!w || !w.on) return '';
      var body = mapHtml(w.map);
      var items = (w.items || []).map(function(it){ return X(it.text) + mapHtml(it.map) + chipsHtml(it.chips); });
      if (items.length) body += ol(items, true);
      return '<div class="tip-warn"><div class="tip-warn-head"><span class="tip-w">주의</span>' + (w.head ? '<span>' + X(w.head) + '</span>' : '') + '</div>' + body + '</div>';
    }
    var h = '', secN = 0, items = [];
    function flush(){ if (items.length){ h += ol(items); items = []; } }
    blocks.forEach(function(b){
      if (b.t === 'item'){
        var s = X(b.text);
        if (tipLines(b.subs).length) s += ul(tipLines(b.subs));
        if (b.sum && b.sum.trim()) s += sum(b.sum);
        s += exHtml(b.ex);
        items.push(s);
        return;
      }
      flush();
      if (b.t === 'sec'){ secN++; h += '<div class="tip-line l0"><span class="tip-num">' + secN + '</span><span>' + X(b.text) + '</span></div>'; }
      else if (b.t === 'sub') h += '<div class="tip-sub">' + X(b.text) + '</div>';
      else if (b.t === 'card'){
        h += '<div class="tip-card"><div class="tip-card-head"><span class="tip-law">' + esc(b.law || '') + '</span><span>' + X(b.head) + '</span></div>' + exHtml(b.ex) + warnHtml(b.warn) + '</div>';
      }
    });
    flush();
    return h || '<div class="empty-note">내용이 없어요. ✏️ 편집으로 추가해 보세요.</div>';
  }

  // ----- 편집 화면 -----
  function tipField(label, path, val, kind, rows, ph){
    var a = ' data-p="' + path + '" placeholder="' + esc(ph || '') + '"';
    return '<label>' + esc(label) + '</label>' + (kind === 'area'
      ? '<textarea' + a + ' rows="' + (rows || 2) + '">' + esc(val) + '</textarea>'
      : '<input type="text"' + a + ' value="' + esc(val) + '">');
  }
  var TIP_MAP_HELP = '줄마다 하나: 구 → {b|ぐ}{g|(具)}\n# ㄱ  ← 묶음 이름 (선택)\n등  ← 맨 끝에 "등" 표시';
  function tipEditHtml(){
    var d = state.tipDraft;
    var bar = '<div class="tip-ed-bar"><span class="tip-ed-hint">글자를 선택하고 누르면 서식이 들어가요:</span>' +
      [['r','빨강'],['h','형광펜'],['b','굵게'],['g','회색']].map(function(f){
        return '<button type="button" class="tip-mini tip-fmt-' + f[0] + '" data-fmt="' + f[0] + '">' + f[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="tip-ed-hint2">화살표는 <b>-&gt;</b> 로 쳐도 → 로 바뀌어요. 블록 번호(1, 2, 3…)는 자동이에요.</div>';
    var typeOpts = '<option value="">＋ 아래에 추가…</option>' + Object.keys(TIP_TYPES).map(function(k){ return '<option value="' + k + '">' + TIP_TYPES[k] + '</option>'; }).join('');
    var blocks = d.map(function(b, i){
      var head = '<div class="tip-ed-head"><span class="tip-ed-type">' + TIP_TYPES[b.t] + '</span><span class="tip-ed-spacer"></span>' +
        '<select class="tip-mini" data-add-after="' + i + '">' + typeOpts + '</select>' +
        '<button type="button" class="tip-mini" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="tip-mini" data-act="down" data-i="' + i + '"' + (i === d.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="tip-mini" data-act="del" data-i="' + i + '">✕</button></div>';
      var body = '';
      if (b.t === 'sec' || b.t === 'sub') body = tipField('제목', i + '.text', b.text, 'in');
      else if (b.t === 'item'){
        body = tipField('내용', i + '.text', b.text, 'area', 2) +
          tipField('세부 항목 (선택, 줄마다 하나)', i + '.subs', b.subs, 'area', 2) +
          tipField('즉 요약 (선택, 노란 박스)', i + '.sum', b.sum, 'in') +
          tipField('예시 (선택, 줄마다 하나 · → 로 연결)', i + '.ex', b.ex, 'area', 2, '山 : 산 → ㅅ + ㅏ + ㄴ → {b|さん}');
      } else if (b.t === 'card'){
        var w = b.warn || (b.warn = { on:false, head:'', map:'', items:[] });
        body = tipField('법칙 이름', i + '.law', b.law, 'in', 0, '초성 대응 ③') +
          tipField('법칙 문장', i + '.head', b.head, 'area', 2) +
          tipField('예시 (선택, 줄마다 하나 · → 로 연결)', i + '.ex', b.ex, 'area', 3, '운영(運営) → {b|う}ん{b|え}い') +
          '<label class="tip-ck"><input type="checkbox" data-p="' + i + '.warn.on"' + (w.on ? ' checked' : '') + '> 빨간 「주의」 박스 넣기</label>';
        if (w.on){
          body += '<div class="tip-ed-sub"><div class="tip-ed-subtitle">주의 박스</div>' +
            tipField('주의 머리말 (선택)', i + '.warn.head', w.head, 'in') +
            tipField('대응표 (선택)', i + '.warn.map', w.map, 'area', 4, TIP_MAP_HELP) +
            (w.items || []).map(function(it, j){
              var p = i + '.warn.items.' + j;
              return '<div class="tip-ed-item"><div class="tip-ed-head"><span class="tip-ed-type red">주의 항목 ' + (j + 1) + '</span><span class="tip-ed-spacer"></span>' +
                '<button type="button" class="tip-mini" data-act="witem-del" data-i="' + i + '" data-j="' + j + '">✕</button></div>' +
                tipField('내용', p + '.text', it.text, 'area', 2) +
                tipField('대응표 (선택)', p + '.map', it.map, 'area', 4, TIP_MAP_HELP) +
                tipField('칩 (선택, 줄마다 한자 | 한국음 | 읽기)', p + '.chips', it.chips, 'area', 3, '和 | 화 | わ') + '</div>';
            }).join('') +
            '<button type="button" class="tip-mini" data-act="witem-add" data-i="' + i + '">＋ 주의 항목 추가</button></div>';
        }
      }
      return '<div class="tip-ed-block">' + head + body + '</div>';
    }).join('');
    var adds = '<div class="tip-ed-adds"><span>맨 끝에 추가:</span>' + Object.keys(TIP_TYPES).map(function(k){
      return '<button type="button" class="tip-mini" data-act="add-end" data-type="' + k + '">＋ ' + TIP_TYPES[k] + '</button>';
    }).join('') + '</div>';
    return bar + blocks + adds;
  }
  function renderTip(){
    var body = document.getElementById('tip-body'), ov = document.getElementById('tip-overlay'), acts = document.getElementById('tip-actions');
    if (!body) return;
    var st = ov.scrollTop;
    if (state.tipEdit){
      body.innerHTML = tipEditHtml();
      acts.innerHTML = '<button type="button" class="primary" data-tip-act="save">저장</button><button type="button" class="secondary" data-tip-act="cancel">취소</button><button type="button" class="secondary warn" data-tip-act="reset">기본값</button>';
    } else {
      body.innerHTML = tipBuild(tipBlocks());
      acts.innerHTML = '<button type="button" class="secondary" data-tip-act="edit">✏️ 편집</button>';
    }
    ov.scrollTop = st;
  }
  function tipSetPath(root, path, val){
    var p = path.split('.'), o = root;
    for (var k = 0; k < p.length - 1; k++) o = o[p[k]];
    o[p[p.length - 1]] = val;
  }
  function tipWrap(code){
    var el = tipLastField;
    if (!el || !document.body.contains(el) || !el.dataset.p) return;
    var s = el.selectionStart, e = el.selectionEnd, v = el.value, sel = v.slice(s, e);
    var ins = '{' + code + '|' + sel + '}';
    el.value = v.slice(0, s) + ins + v.slice(e);
    el.focus();
    var pos = sel ? s + ins.length : s + 3;
    el.setSelectionRange(pos, pos);
    tipSetPath(state.tipDraft, el.dataset.p, el.value);
  }
  function tipBind(){
    var body = document.getElementById('tip-body'), acts = document.getElementById('tip-actions');
    body.addEventListener('focusin', function(e){ if (e.target.dataset && e.target.dataset.p) tipLastField = e.target; });
    body.addEventListener('mousedown', function(e){ if (e.target.closest && e.target.closest('[data-fmt]')) e.preventDefault(); });
    body.addEventListener('input', function(e){
      var t = e.target;
      if (!state.tipEdit || !t.dataset || !t.dataset.p || t.type === 'checkbox') return;
      tipSetPath(state.tipDraft, t.dataset.p, t.value);
    });
    body.addEventListener('change', function(e){
      var t = e.target;
      if (!state.tipEdit) return;
      if (t.type === 'checkbox' && t.dataset.p){ tipSetPath(state.tipDraft, t.dataset.p, t.checked); renderTip(); return; }
      if (t.dataset && t.dataset.addAfter !== undefined && t.value){
        state.tipDraft.splice(+t.dataset.addAfter + 1, 0, tipNew(t.value));
        renderTip();
      }
    });
    body.addEventListener('click', function(e){
      if (!state.tipEdit) return;
      var f = e.target.closest && e.target.closest('[data-fmt]');
      if (f){ tipWrap(f.getAttribute('data-fmt')); return; }
      var b = e.target.closest && e.target.closest('[data-act]');
      if (!b) return;
      var d = state.tipDraft, act = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), j = +b.getAttribute('data-j');
      if (act === 'up' && i > 0){ var a1 = d[i]; d[i] = d[i - 1]; d[i - 1] = a1; }
      else if (act === 'down' && i < d.length - 1){ var a2 = d[i]; d[i] = d[i + 1]; d[i + 1] = a2; }
      else if (act === 'del'){ if (!confirm('이 블록을 삭제할까요?')) return; d.splice(i, 1); }
      else if (act === 'witem-add'){ d[i].warn.items.push({ text:'', map:'', chips:'' }); }
      else if (act === 'witem-del'){ if (!confirm('이 주의 항목을 삭제할까요?')) return; d[i].warn.items.splice(j, 1); }
      else if (act === 'add-end'){ d.push(tipNew(b.getAttribute('data-type'))); }
      renderTip();
      if (act === 'add-end') document.getElementById('tip-overlay').scrollTop = 1e6;
    });
    acts.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('[data-tip-act]');
      if (!b) return;
      var act = b.getAttribute('data-tip-act');
      if (act === 'edit'){ state.tipDraft = tipClone(tipBlocks()); state.tipEdit = true; renderTip(); document.getElementById('tip-overlay').scrollTop = 0; }
      else if (act === 'cancel'){ if (!confirm('편집한 내용을 버릴까요?')) return; state.tipEdit = false; state.tipDraft = null; renderTip(); }
      else if (act === 'reset'){ if (!confirm('처음 내용으로 되돌릴까요? (저장 전까지는 취소할 수 있어요)')) return; state.tipDraft = tipClone(TIP_DEFAULT); renderTip(); }
      else if (act === 'save'){
        state.tipBlocks = tipClone(state.tipDraft);
        if (settingsRef) settingsRef.set({ tipBlocks: state.tipBlocks }, { merge: true }).catch(function(err){ console.error(err); setSyncBadge('error'); });
        state.tipEdit = false; state.tipDraft = null; renderTip();
        document.getElementById('tip-overlay').scrollTop = 0;
      }
    });
  }
  function openTip(){
    state.tipEdit = false; state.tipDraft = null;
    renderTip();
    document.getElementById('tip-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    document.getElementById('tip-overlay').scrollTop = 0;
  }
  function closeTip(){
    if (state.tipEdit && !confirm('편집 중인 내용이 저장되지 않아요. 닫을까요?')) return;
    state.tipEdit = false; state.tipDraft = null;
    document.getElementById('tip-overlay').classList.add('hidden');
    document.body.style.overflow = '';
  }
  tipBind();
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('[data-open-tip]')) openTip();
  });
  document.getElementById('tip-close').addEventListener('click', closeTip);
  document.getElementById('tip-overlay').addEventListener('click', function(e){ if (e.target === this) closeTip(); });
  document.addEventListener('keydown', function(e){
    var ov = document.getElementById('tip-overlay');
    if (e.key === 'Escape' && ov && !ov.classList.contains('hidden')) closeTip();
  });

  document.getElementById('settings-close').addEventListener('click', closeSettings);
  document.getElementById('settings-overlay').addEventListener('click', function(e){
    if (e.target === this) closeSettings();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && state.settingsOpen) closeSettings();
  });

  // 단어/한자/문형 등 입력칸에서 (특히 한글·일본어 입력 중 엔터로 조합을
  // 확정할 때) 실수로 폼이 그대로 제출되지 않도록 막음. 대신 Ctrl(⌘)+Enter로
  // 어느 칸에서든 바로 저장할 수 있음 — 터치 없이 키보드만으로 입력 가능.
  document.addEventListener('keydown', function(e){
    var form = e.target && e.target.closest && e.target.closest('form.entry');
    if (!form) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      return;
    }
    if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' &&
        (e.target.type === 'text' || !e.target.type)){
      e.preventDefault();
      var focusables = Array.prototype.slice.call(form.querySelectorAll('input, textarea, select, button'))
        .filter(function(el){ return !el.disabled && el.offsetParent !== null && el.getAttribute('tabindex') !== '-1'; });
      var idx = focusables.indexOf(e.target);
      if (idx > -1 && idx < focusables.length - 1) focusables[idx + 1].focus();
    }
  });

  // 복습 중 키보드 단축키: 스페이스바 = 답 보기, ← = 까먹었어요, → = 기억나요.
  document.addEventListener('keydown', function(e){
    if (state.settingsOpen) return;
    if (state.activeTab !== 'review' || !state.reviewQueue) return;
    if (state.reviewIdx >= state.reviewQueue.length) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.code === 'KeyZ' || e.key === 'Backspace'){
      e.preventDefault();
      undoLastReview();
      return;
    }
    if (e.code === 'Space' || e.key === ' '){
      if (!state.reviewFlipped){
        e.preventDefault();
        state.reviewFlipped = true;
        renderReview();
      }
      return;
    }
    if (state.reviewFlipped && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      e.preventDefault();
      var cur = state.reviewQueue[state.reviewIdx];
      applyReview(cur, e.key === 'ArrowRight');
      state.reviewIdx += 1;
      state.reviewFlipped = false;
      renderReview();
    }
  });

  auth.onAuthStateChanged(function(user){
    detachFirestore();
    if (user){
      document.documentElement.setAttribute('data-theme', initialTheme());
      state.theme = document.documentElement.getAttribute('data-theme');
      state.activeTab = 'review'; state.reviewQueue = null; state.reviewIdx = 0; state.reviewFlipped = false;
      state.openDetail = {}; state.editMode = {};
      state.reviewMissed = []; state.reviewRetry = false;
      showApp();
      renderAll();
      attachFirestore(user.uid);
    } else {
      showLogin();
    }
  });
})();
</script>
<script>
/* 아이패드/아이폰 '스마트 문장 부호'(따옴표를 ’ ‘ 로 바꿈)·자동수정을 입력칸에서 끔 */
(function(){
  function fix(el){
    if (!el || !el.tagName) return;
    var t = el.tagName;
    if (t !== 'INPUT' && t !== 'TEXTAREA') return;
    if (t === 'INPUT' && /^(checkbox|radio|button|submit|file|range|color)$/i.test(el.type)) return;
    el.setAttribute('autocorrect', 'off');
    el.setAttribute('autocapitalize', 'off');
    el.setAttribute('spellcheck', 'false');
  }
  function fixAll(root){ (root.querySelectorAll ? root.querySelectorAll('input,textarea') : []).forEach(fix); }
  fixAll(document);
  new MutationObserver(function(ms){
    ms.forEach(function(m){
      m.addedNodes.forEach(function(n){ if (n.nodeType === 1){ fix(n); fixAll(n); } });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('focusin', function(e){ fix(e.target); });
})();
</script>
<script>
/* 아이패드 사파리는 Tab 키로 버튼(+ 단어 추가 등)을 건너뛰어서, 입력/수정 폼 안에서는
   Tab / Shift+Tab 이동을 직접 처리해 버튼도 순서대로 선택되게 함 (PC와 같은 순서). */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Tab' || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  var t = e.target;
  if (!t || !t.closest) return;
  var form = t.closest('form.entry');
  if (!form) return;
  var all = form.querySelectorAll('input:not([disabled]):not([type="hidden"]), textarea:not([disabled]), select:not([disabled]), button:not([disabled]), [tabindex]');
  var list = Array.prototype.filter.call(all, function(el){
    return el.tabIndex >= 0 && !el.classList.contains('icon-x') && (el.offsetParent !== null || el === t);
  });
  var i = list.indexOf(t);
  if (i === -1) return;
  var next = list[i + (e.shiftKey ? -1 : 1)];
  if (!next) return;   // 폼의 처음/끝에서는 브라우저 기본 동작
  e.preventDefault();
  next.focus();
});
</script>
